<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังนำท่านไปยังบริการ...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 380px;
            width: 90%;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #007aff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="status-title">กำลังเปิดระบบ...</h2>
    <p id="status-desc">หากหน้าต่างไม่เปิดอัตโนมัติ กรุณากดปุ่มด้านล่าง</p>
    <a id="redirect-btn" href="#" class="btn">เข้าสู่เว็บไซต์</a>
</div>

<script>
    // 🔴 1. ใส่ลิงก์ Web App ของ Google Apps Script ที่นี่
    const targetGasUrl = "https://script.google.com/macros/s/AKfycbwks3Yu_ksxl0qNTPleL3ALr4guM16zq--CzEFXNFSmYn9zzMAv_G-F31FqYdzSHSMR/exec";

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isLine = userAgent.indexOf("Line") > -1;
    const isFB = userAgent.indexOf("FBAN") > -1 || userAgent.indexOf("FBAV") > -1;
    const isInApp = isLine || isFB;

    const isAndroid = /android/i.test(userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(userAgent);

    const btn = document.getElementById("redirect-btn");
    const title = document.getElementById("status-title");

    if (isInApp) {
        if (isAndroid) {
            // Android: ใช้ Intent Scheme เพื่อเด้งเปิดด้วย Chrome
            const cleanUrl = targetGasUrl.replace(/^https?:\/\//, "");
            const intentUrl = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;`;
            
            btn.href = intentUrl;
            window.location.href = intentUrl; // สั่ง Redirect อัตโนมัติ

        } else if (isIOS) {
            // iOS: ใช้ Scheme x-safari-https เพื่อเปิด Safari
            const cleanUrl = targetGasUrl.replace(/^https?:\/\//, "");
            const safariUrl = `x-safari-https://${cleanUrl}`;

            btn.href = safariUrl;
            title.innerText = "โปรดเปิดบน Safari";
            
            // พยายาม Redirect อัตโนมัติ (iOS บางเวอร์ชันต้องกดปุ่ม)
            window.location.href = safariUrl;
        }
    } else {
        // หากเป็นเบราว์เซอร์ปกติ ให้เปิดลิงก์ GAS ได้เลย
        btn.href = targetGasUrl;
        window.location.href = targetGasUrl;
    }
</script>

</body>
</html>
