<style>
  :root {
    color-scheme: light;
    /* ---- Paper / ink palette ---- */
    --surface: #fffdf6;
    --surface-soft: #f4ecd8;
    --surface-raised: #fffefa;
    --line: #ddceac;
    --line-soft: #ece1c4;
    --text-soft: #7c7057;
    --text-faint: #ab9d7c;
    --ink: #2c2618;

    --brand: #3f6b52;
    --brand-strong: #2c4c3a;
    --brand-hover: #23392c;
    --brand-soft: #e2e9da;
    --brand-fill: #2c4c3a;
    --danger: #a03f2c;
    --income: #3f6b52;
    --expense: #a03f2c;
    --warning: #a97a24;
    --neutral-grey: #ddceac;
    --margin-rule: #c4635a;

    --accent-fill: var(--brand-fill);
    --accent-fill-ink: #fff;

    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 10px;
    --r-xl: 14px;
    --r-pill: 999px;

    --shadow: 0 1px 0 rgba(44, 38, 24, .06), 0 6px 16px -10px rgba(44, 38, 24, .18);
    --shadow-lg: 0 22px 46px -18px rgba(44, 38, 24, .35);
    --shadow-btn: 0 2px 0 rgba(0, 0, 0, .18);
    --shadow-tile: 0 3px 10px -6px rgba(44, 38, 24, .22);
    --shadow-mark: 0 3px 0 rgba(0, 0, 0, .2);
    --shadow-segmented: 0 1px 3px rgba(44, 38, 24, .18);
    --shadow-fab: 0 10px 22px -6px rgba(44, 38, 24, .4);

    --bg-auth: radial-gradient(120% 140% at 15% -10%, #f8f1de 0%, #efe3c3 55%, #e7d8ae 100%);
    --bg-metric: rgba(255, 253, 246, .6);
    --bg-modal-backdrop: rgba(30, 25, 14, .45);
    --bg-loading-overlay: rgba(30, 25, 14, .18);

    --paper-grain:
      radial-gradient(circle at 22% 24%, rgba(44, 38, 24, .025) 0, transparent 42%),
      radial-gradient(circle at 78% 68%, rgba(44, 38, 24, .022) 0, transparent 40%),
      repeating-linear-gradient(178deg, rgba(44, 38, 24, .015) 0 1px, transparent 1px 3px);

    --font-display: 'Mali', 'Sarabun', cursive;
    --font-body: 'Sarabun', 'Inter', 'Noto Sans Thai', ui-sans-serif, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

    --sidebar-w: 15.5rem;
  }

  .dark {
    color-scheme: dark;
    /* ---- Warm "espresso paper" dark palette — keeps the brand's warm tone instead of neutral black ---- */
    --surface: #1e1811;
    --surface-soft: #16120c;
    --surface-raised: #2a2216;
    --line: #4a3f2c;
    --line-soft: #362d1f;
    --text-soft: #b8ac8e;
    --text-faint: #7d715a;
    --ink: #f5eedd;

    --brand: #8fbf9f;
    --brand-strong: #9fd0af;
    --brand-hover: #bce3c6;
    --brand-soft: #1c2a20;

    --danger: #e0916f;
    --income: #8fbf9f;
    --expense: #e0916f;
    --warning: #dbb06c;
    --neutral-grey: #4a3f2c;
    --margin-rule: #b06c5c;

    /* ปุ่ม/ป้ายแบบ "เติมสี" (active state) ในธีมมืดใช้สีอ่อน+ตัวอักษรเข้ม แทนสีเขียวเข้ม+ขาว
       เพื่อให้ตัดกับพื้นหลังมืดชัดเจน สอดคล้องกับปุ่มหลัก (.primary-btn) ที่ทำแบบนี้อยู่แล้ว */
    --accent-fill: var(--brand-strong);
    --accent-fill-ink: #10160f;

    --shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 10px 24px -14px rgba(0, 0, 0, .8);
    --shadow-lg: 0 26px 54px -18px rgba(0, 0, 0, .85);
    --shadow-btn: 0 2px 0 rgba(0, 0, 0, .5);
    --shadow-tile: 0 3px 10px -6px rgba(0, 0, 0, .6);
    --shadow-mark: 0 3px 0 rgba(0, 0, 0, .5);
    --shadow-segmented: 0 1px 3px rgba(0, 0, 0, .5);
    --shadow-fab: 0 10px 24px -6px rgba(0, 0, 0, .7);

    --bg-auth: radial-gradient(120% 140% at 15% -10%, #1c1811 0%, #100d09 60%, #060503 100%);
    --bg-metric: rgba(22, 18, 12, .65);
    --bg-modal-backdrop: rgba(0, 0, 0, .78);
    --bg-loading-overlay: rgba(0, 0, 0, .6);

    --paper-grain:
      radial-gradient(circle at 22% 24%, rgba(255, 255, 255, .03) 0, transparent 42%),
      radial-gradient(circle at 78% 68%, rgba(255, 255, 255, .025) 0, transparent 40%),
      repeating-linear-gradient(178deg, rgba(255, 255, 255, .015) 0 1px, transparent 1px 3px);
  }

  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    overflow-x: hidden;
    background-color: var(--surface-soft);
    background-image: var(--paper-grain);
  }

  body.modal-open { overflow: hidden; }

  /* ============ SCROLLBAR — themed to match the notebook paper ============ */
  html {
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }

  ::-webkit-scrollbar-thumb {
    background-color: var(--line);
    border-radius: var(--r-pill);
    border: 2px solid var(--surface-soft);
    background-clip: padding-box;
  }

  ::-webkit-scrollbar-thumb:hover { background-color: var(--brand); }
  ::-webkit-scrollbar-corner { background: transparent; }

  .tabs-nav, .idx-rail, .ledger-sheet-wrap, .nlp-confirm-list, .envelope-row {
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  @media (min-width: 1024px) {
    .tabs-nav {
      scrollbar-color: rgba(255,253,246,.3) transparent;
    }
    .tabs-nav::-webkit-scrollbar-thumb {
      background-color: rgba(255,253,246,.3);
      border-color: var(--brand-strong);
    }
    .tabs-nav::-webkit-scrollbar-thumb:hover { background-color: rgba(255,253,246,.55); }
  }

  button, input, select, textarea { font: inherit; color: inherit; }

  ::selection { background: color-mix(in srgb, var(--brand) 30%, transparent); }

  h1, h2, h3 { font-family: var(--font-display); }

  /* ============ AUTH SCREEN — an open notebook lying on the desk ============ */
  .auth-bg {
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,.12) 100%),
      var(--bg-auth);
    background-color: var(--surface-soft);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .auth-bg::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: var(--paper-grain);
    z-index: 0;
  }

  .auth-book {
    position: relative;
    z-index: 1;
    display: flex;
    width: min(76rem, 96vw);
    min-height: 32rem;
    border-radius: var(--r-xl);
    overflow: hidden;
    box-shadow: 0 50px 90px -30px rgba(20,17,10,.55), 0 18px 40px -18px rgba(20,17,10,.4);
  }

  .dark .auth-book { box-shadow: 0 50px 90px -30px rgba(0,0,0,.8), 0 18px 40px -18px rgba(0,0,0,.7); }

  .auth-page {
    position: relative;
    flex: 1 1 50%;
    min-width: 0;
    padding: 2.6rem 2.6rem 2.2rem;
    background-color: var(--surface);
    background-image: var(--paper-grain);
  }

  .auth-page-left {
    background-color: var(--brand-fill);
    background-image: none;
    color: #f3ecd8;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .auth-page-left::after {
    content: "";
    position: absolute;
    inset: 0 0 0 auto;
    width: 2.2rem;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,.22));
    pointer-events: none;
  }

  .auth-page-right { display: flex; align-items: center; justify-content: center; }

  .auth-page-right::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 2.2rem;
    background: linear-gradient(270deg, transparent, rgba(0,0,0,.06));
    pointer-events: none;
  }

  .dark .auth-page-right::before { background: linear-gradient(270deg, transparent, rgba(0,0,0,.35)); }

  .auth-book-spine {
    position: relative;
    flex: 0 0 1.6rem;
    background: linear-gradient(90deg, #1c3025, #16241c 45%, #16241c 55%, #1c3025);
    background-image:
      repeating-radial-gradient(circle at 50% 0, rgba(0,0,0,.5) 0 2px, transparent 2px 22px),
      linear-gradient(90deg, #1c3025, #16241c 45%, #16241c 55%, #1c3025);
    box-shadow: inset 6px 0 10px -6px rgba(0,0,0,.5), inset -6px 0 10px -6px rgba(0,0,0,.5);
  }

  .auth-eyebrow {
    margin: 0 0 .5rem;
    color: #cfe3d3;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: .92rem;
    letter-spacing: .1em;
  }

  .auth-title {
    margin: 0;
    color: #fbf6e7;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.1rem, 3.4vw, 2.9rem);
    line-height: 1.15;
  }

  .auth-sub { margin: .8rem 0 0; color: #d7e6cf; font-size: .92rem; max-width: 24rem; }

  .auth-journal-list { display: grid; gap: 1rem; margin: 1.8rem 0 0; padding: 0; list-style: none; }

  .auth-journal-list li {
    display: flex;
    align-items: flex-start;
    gap: .8rem;
    border-top: 1px dashed rgba(243, 236, 216, .28);
    padding-top: 1rem;
  }

  .auth-journal-list li:first-child { border-top: none; padding-top: 0; }

  .auth-journal-icon {
    display: grid;
    flex: 0 0 auto;
    width: 2.3rem;
    height: 2.3rem;
    place-items: center;
    border-radius: 50%;
    border: 1px dashed rgba(243, 236, 216, .4);
    background: rgba(255, 253, 246, .08);
    color: #cfe3d3;
  }

  .auth-journal-icon svg { width: 1.1rem; height: 1.1rem; }

  .auth-journal-list strong { display: block; color: #fbf6e7; font-size: .92rem; font-weight: 700; }
  .auth-journal-list small { display: block; margin-top: .15rem; color: #c3d6bc; font-size: .78rem; line-height: 1.4; }

  .auth-seal {
    align-self: flex-end;
    display: grid;
    width: 3.4rem;
    height: 3.4rem;
    place-items: center;
    border-radius: 50%;
    background: rgba(255, 253, 246, .1);
    border: 1.5px dashed rgba(243, 236, 216, .4);
    color: #cfe3d3;
    transform: rotate(-8deg);
    margin-top: 1.6rem;
  }

  .auth-seal svg { width: 1.5rem; height: 1.5rem; }

  .auth-tape {
    position: absolute;
    width: 3.6rem;
    height: 1.15rem;
    background: color-mix(in srgb, var(--warning) 55%, transparent);
    border: 1px solid color-mix(in srgb, var(--warning) 70%, var(--line));
    opacity: .85;
  }

  .brand-mark {
    display: grid;
    width: 2.85rem;
    height: 2.85rem;
    place-items: center;
    border-radius: 50%;
    background: var(--brand-strong);
    color: var(--surface);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.2rem;
    box-shadow: var(--shadow-mark);
    border: 2px solid var(--surface);
    outline: 1.5px solid var(--brand-strong);
  }

  .auth-card,
  .panel,
  .summary-card,
  .comparison-card {
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .auth-card {
    width: 100%;
    max-width: 24rem;
    border: none;
    box-shadow: none;
    background: transparent;
    padding: 0;
    position: relative;
  }

  .auth-card h2 { font-weight: 700; }

  .auth-link-row { display: flex; justify-content: flex-end; margin-top: .4rem; }
  .auth-link-btn { background: none; border: none; padding: 0; font-size: .78rem; font-weight: 700; color: var(--brand-strong); text-decoration: underline; cursor: pointer; }
  .auth-link-btn:hover { color: var(--brand); }

  /* ============ FORMS — ruled-line inputs ============ */
  .form-label {
    display: block;
    margin-bottom: .4rem;
    color: var(--text-soft);
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .02em;
  }

  .form-input, .search-wrap input, .form-select {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--line);
    border-radius: 0;
    background: transparent;
    padding: .7rem .1rem;
    color: inherit;
    outline: none;
    font-size: 1rem;
    transition: border-color .15s ease, background .15s ease;
  }

  .form-input:focus, .search-wrap input:focus {
    border-bottom-color: var(--brand);
    background: color-mix(in srgb, var(--brand) 5%, transparent);
  }

  select.form-input { border-bottom: 1.5px solid var(--line); cursor: pointer; }

  /* ============ BUTTONS — stamped labels ============ */
  .primary-btn, .secondary-btn, .icon-chip, .ghost-icon, .text-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .55rem;
    border-radius: var(--r-md);
    font-weight: 700;
    font-family: var(--font-body);
    transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }

  .primary-btn {
    min-height: 2.9rem;
    background: var(--brand-strong);
    color: var(--surface);
    box-shadow: var(--shadow-btn);
    border: 1px solid var(--brand-strong);
  }

  .primary-btn:hover { background: var(--brand-hover); }
  .dark .primary-btn { color: #10160f; }

  .primary-btn:hover, .secondary-btn:hover, .icon-chip:hover, .ghost-icon:hover, .text-btn:hover {
    transform: translateY(-1px);
  }

  .primary-btn:active, .secondary-btn:active, .icon-chip:active, .ghost-icon:active {
    transform: translateY(1px);
    box-shadow: none;
  }

  .primary-btn:disabled { cursor: not-allowed; opacity: .55; transform: none; }

  .secondary-btn, .icon-chip {
    min-height: 2.65rem;
    border: 1.5px dashed var(--line);
    background: var(--surface);
    padding: 0 .95rem;
    color: inherit;
  }

  .secondary-btn:hover, .icon-chip:hover {
    border-color: var(--brand);
    border-style: solid;
    color: var(--brand-strong);
  }

  .ghost-icon {
    width: 2.65rem;
    height: 2.65rem;
    border: 1px solid var(--line);
    background: var(--surface);
    color: inherit;
    border-radius: 50%;
  }

  .ghost-icon:hover { border-color: var(--brand); color: var(--brand-strong); }

  .text-btn { color: var(--brand-strong); font-size: .88rem; text-decoration: underline dashed; text-underline-offset: 3px; }

  .primary-btn svg, .secondary-btn svg, .icon-chip svg, .ghost-icon svg, .nav-item svg, .mobile-nav-item svg {
    width: 1.1rem; height: 1.1rem; flex: 0 0 auto;
  }

  /* ============ TOAST — a pinned note ============ */
  .toast {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 80;
    max-width: min(24rem, calc(100vw - 2rem));
    border: 1px solid var(--line);
    border-left: 4px solid var(--brand);
    border-radius: var(--r-md);
    background: var(--surface-raised);
    padding: .9rem 1.1rem;
    box-shadow: var(--shadow-lg);
    font-size: .9rem;
    font-weight: 700;
    transform: rotate(-.6deg);
  }

  .toast.error { border-left-color: var(--danger); color: var(--danger); }

  /* ---- Undo toast (replaces confirm() popups for deletes) ---- */
  .undo-toast {
    position: fixed; left: 50%; bottom: calc(6.2rem + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: .9rem;
    background: var(--ink); color: #f6f0dd; padding: .75rem 1.1rem; border-radius: var(--r-pill);
    box-shadow: var(--shadow-lg); font-size: .85rem; font-weight: 700;
    max-width: min(92vw, 26rem); overflow: hidden;
  }
  @media (min-width: 1024px) { .undo-toast { bottom: 2rem; } }
  .undo-toast button { background: none; border: none; color: var(--warning); font-weight: 800; text-decoration: underline; cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
  .undo-toast .undo-progress { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--warning); border-radius: 0 0 999px 999px; }
  @keyframes undo-countdown { from { width: 100%; } to { width: 0%; } }

  .is-pending-delete { opacity: .35; filter: grayscale(1); pointer-events: none; transition: opacity .2s ease, filter .2s ease; }

  /* ============ APP SHELL — book spine sidebar ============ */
  .app-content {
    min-height: 100vh;
    max-width: 60rem;
    margin: 0 auto;
    padding: 1rem 1rem 6.5rem;
    position: relative;
  }

  @media (min-width: 1024px) {
    .app-content {
      max-width: none;
      margin: 0;
      padding: 1.75rem 2.5rem 3rem calc(var(--sidebar-w) + 2.5rem);
    }
    .app-content > .view-section,
    .app-content > .masthead { max-width: 62rem; }
  }

  .masthead-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface-soft) 92%, transparent);
    backdrop-filter: blur(14px);
  }

  .masthead-bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    max-width: 60rem;
    margin: 0 auto;
    padding: .85rem 1rem;
  }

  @media (min-width: 1024px) {
    .masthead-bar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-w);
      height: 100vh;
      border-bottom: none;
      border-right: 3px solid var(--brand-fill);
      background: var(--brand-fill);
      backdrop-filter: none;
      z-index: 25;
    }

    .masthead-bar::before {
      content: "";
      position: absolute;
      left: 1.55rem;
      top: 0;
      bottom: 0;
      width: 1px;
      background: repeating-linear-gradient(0deg, rgba(255,253,246,.16) 0 7px, transparent 7px 16px);
    }

    .masthead-bar-inner {
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      height: 100%;
      max-width: none;
      padding: 1.6rem 1.2rem 1.4rem;
      gap: 0;
    }

    .masthead-bar .brand { color: #f6f0dd; margin-bottom: 2.1rem; }
    .masthead-bar .brand span { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }

    .profile-chip {
      margin-top: auto;
      width: 100%;
      padding-top: 1rem;
      border-top: 1px dashed rgba(255, 253, 246, .28);
    }

    .profile-chip #profileName { color: #f6f0dd; }
    .profile-chip #profileEmail { color: #cfd8c7 !important; }
    .masthead-bar .ghost-icon { border-color: rgba(255,253,246,.3); background: transparent; color: #f6f0dd; }
    .masthead-bar .ghost-icon:hover { border-color: #f6f0dd; }
  }

  .masthead-bar .brand { display: flex; align-items: center; gap: .65rem; }

  .profile-chip { display: flex; align-items: center; gap: .6rem; }

  .profile-chip-main {
    display: flex; align-items: center; gap: .6rem; min-width: 0;
    background: none; border: none; padding: .15rem .25rem .15rem .15rem; margin: -0.15rem 0 -0.15rem -0.15rem;
    border-radius: var(--r-pill); text-align: left; cursor: pointer;
    transition: background .2s ease;
  }
  .profile-chip-main:hover { background: color-mix(in srgb, var(--brand) 10%, transparent); }
  .profile-chip-main.active .avatar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand); }

  .avatar {
    width: 2.35rem; height: 2.35rem; flex: 0 0 auto;
    border-radius: 50%; object-fit: cover; background: var(--neutral-grey);
    border: 2px solid var(--surface);
  }

  .masthead { padding: 1.75rem 0 0; }

  .masthead .eyebrow {
    margin: 0 0 .35rem;
    color: var(--brand);
    font-size: .74rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-family: var(--font-mono);
  }

  .masthead-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(1.9rem, 4.4vw, 2.7rem);
    font-weight: 700;
    letter-spacing: -.01em;
    position: relative;
    display: inline-block;
  }

  .masthead-title::after {
    content: "";
    position: absolute;
    left: 0; right: -1rem; bottom: -.28rem;
    height: .5rem;
    background: color-mix(in srgb, var(--warning) 42%, transparent);
    z-index: -1;
    transform: rotate(-.6deg);
  }

  /* ---- Nav tabs: notebook divider tabs on desktop only — mobile uses .mobile-nav instead ---- */
  .tabs-nav {
    display: none;
    gap: 1.4rem;
    margin-top: 1.4rem;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }

  .nav-item {
    flex: 0 0 auto;
    padding: 0 0 .9rem;
    border-bottom: 2px solid transparent;
    color: var(--text-soft);
    font-weight: 700;
    font-size: .88rem;
    white-space: nowrap;
  }

  .nav-item:hover { color: var(--ink); }
  .nav-item.active { color: var(--brand-strong); border-color: var(--brand); }

  @media (min-width: 1024px) {
    .tabs-nav {
      display: flex;
      position: fixed;
      left: 0;
      top: 6.2rem;
      bottom: 6.4rem;
      width: var(--sidebar-w);
      z-index: 26;
      flex-direction: column;
      gap: .3rem;
      margin-top: 0;
      padding: 0 .8rem;
      border-bottom: none;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .nav-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: .7rem .9rem;
      border-bottom: none;
      border-radius: var(--r-md) 0 0 var(--r-md);
      color: #d9e4d2;
      font-size: .87rem;
      position: relative;
    }

    .nav-item:hover { color: #f6f0dd; background: rgba(255,253,246,.06); }

    .nav-item.active {
      color: var(--brand-strong);
      background: var(--surface);
    }

    .nav-item.active::after {
      content: "";
      position: absolute;
      right: -1px; top: 0; bottom: 0; width: 3px;
      background: var(--warning);
    }
  }

  .view-section { display: grid; gap: 1.25rem; max-width: 88rem; margin-top: 1.75rem; }
  .view-section > * { min-width: 0; }
  .view-section.hidden { display: none; }

  /* ============ PANELS / "PAGES" ============ */
  .panel { padding: 1.1rem; }
  @media (min-width: 640px) { .panel { padding: 1.5rem; } }

  .panel-title { font-size: 1.1rem; font-weight: 700; font-family: var(--font-display); }

  .card-kicker {
    color: var(--brand-strong);
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-family: var(--font-mono);
  }

  .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; margin-bottom: .1rem; }
  .section-heading h3 { font-size: 1.05rem; font-weight: 700; font-family: var(--font-display); }
  .section-heading p { color: var(--text-soft); font-size: .82rem; }

  .summary-card {
    position: relative;
    min-height: 8.5rem;
    overflow: hidden;
    padding: 1.15rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background-image: repeating-linear-gradient(var(--line-soft) 0 1px, transparent 1px 30px);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .summary-card::before {
    content: "";
    position: absolute;
    top: 0; left: 1.1rem; right: 1.1rem; height: 3px;
    border-radius: 0 0 3px 3px;
    background: var(--brand);
    opacity: .55;
  }

  .summary-card.is-expense::before { background: var(--expense); }
  .summary-card.is-balance::before { background: var(--warning); }
  .summary-card.is-savings::before { background: var(--warning); }

  .summary-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: color-mix(in srgb, var(--brand) 35%, var(--line));
  }

  .summary-card-icon {
    display: grid; place-items: center; width: 2.6rem; height: 2.6rem;
    border-radius: 50%;
    background: color-mix(in srgb, var(--brand) 14%, transparent);
    color: var(--brand-strong);
    align-self: flex-start;
  }

  .summary-card.is-expense .summary-card-icon { background: color-mix(in srgb, var(--expense) 16%, transparent); color: var(--expense); }
  .summary-card.is-balance .summary-card-icon { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--warning); }
  .summary-card.is-savings .summary-card-icon { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--warning); }
  .summary-card-icon svg { width: 1.25rem; height: 1.25rem; }

  .summary-card strong {
    display: block; margin-top: .9rem;
    font-size: clamp(1.5rem, 3.4vw, 2.1rem);
    font-weight: 600; letter-spacing: -.01em;
    font-family: var(--font-mono);
  }

  .status-pill {
    display: inline-flex; align-items: center; gap: .35rem;
    border-radius: var(--r-pill);
    background: color-mix(in srgb, var(--brand) 14%, transparent);
    color: var(--brand-strong);
    padding: .42rem .8rem;
    font-size: .76rem;
    font-weight: 700;
    border: 1px dashed color-mix(in srgb, var(--brand) 45%, transparent);
  }

  .progress-track {
    position: relative;
    height: .75rem;
    overflow: hidden;
    border-radius: var(--r-pill);
    background: color-mix(in srgb, var(--line) 70%, transparent);
    border: 1px solid var(--line);
  }

  .progress-track::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(90deg, rgba(44,38,24,.1) 0 1px, transparent 1px calc(10% - 1px));
    pointer-events: none;
  }

  .progress-bar {
    height: 100%; width: 0%; border-radius: inherit;
    background: var(--brand-strong);
    background-image: linear-gradient(90deg, rgba(255,255,255,.18), transparent 40%);
    transition: width .5s cubic-bezier(.4,0,.2,1), background .3s ease;
  }

  .progress-bar.warning { background-color: var(--warning); }
  .progress-bar.danger { background-color: var(--danger); }

  /* Shared "notebook page" treatment for the big block panels */
  .dash-spread, .ledger-sheet-wrap, .mag-spread, .chart-hero, .trend-mini,
  .timeline-card, .idx-wrap, .budget-gauge-wrap, .next-ticket,
  .add-panel {
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
    box-shadow: var(--shadow);
    max-width: 100%;
    overflow-x: hidden;
  }

  /* ============ DASHBOARD ============ */
  .dash-spread { display: grid; grid-template-columns: 1.7fr 1fr; gap: 0; overflow: hidden; position: relative; }
  @media (max-width: 860px) { .dash-spread { grid-template-columns: 1fr; } }

  .dash-focal {
    padding: 1.9rem 1.7rem 2.1rem 2.3rem;
    border-right: 1px solid var(--line);
    position: relative;
    background-image: repeating-linear-gradient(180deg, transparent 0 2.35rem, var(--line-soft) 2.35rem calc(2.35rem + 1px));
  }

  .dash-focal::before {
    content: "";
    position: absolute;
    left: 1.35rem; top: 0; bottom: 0; width: 1.5px;
    background: var(--margin-rule);
    opacity: .55;
  }

  @media (max-width: 860px) { .dash-focal { border-right: none; border-bottom: 1px solid var(--line); } }

  .kicker { margin: 0 0 .6rem; color: var(--brand); font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-mono); }

  .focal-figure {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(2.6rem, 6vw, 3.9rem);
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1;
  }

  .pull-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 1.4rem; margin-top: 1.4rem; padding-top: 1.1rem; border-top: 1px dashed var(--line); }
  .pull-stat { display: flex; align-items: center; gap: .45rem; font-family: var(--font-mono); font-weight: 600; font-size: .96rem; }
  .pull-stat svg { width: 1.05rem; height: 1.05rem; color: var(--text-soft); }
  .pull-stat.in svg { color: var(--income); }
  .pull-stat.out svg { color: var(--expense); }

  .dash-budget-bar { margin-top: 1.1rem; }
  .dash-budget-meta { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; margin-top: .65rem; font-size: .78rem; font-weight: 600; }

  .dash-rail { padding: 1.7rem 1.5rem; background-color: var(--surface-soft); }
  .rail-block h3 { margin: 0 0 .9rem; color: var(--text-soft); font-size: .75rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; font-family: var(--font-mono); }
  .dash-recent-list { display: grid; gap: .6rem; }

  .dash-stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }

  @media (min-width: 700px) {
    .dash-stats-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .dash-stats-grid .summary-card:nth-child(4n+1) { transform: rotate(-.6deg); }
  .dash-stats-grid .summary-card:nth-child(4n+2) { transform: rotate(.45deg); }
  .dash-stats-grid .summary-card:nth-child(4n+3) { transform: rotate(-.35deg); }
  .dash-stats-grid .summary-card:nth-child(4n+4) { transform: rotate(.55deg); }
  .dash-stats-grid .summary-card:hover { transform: translateY(-4px) rotate(0deg); }

  .status-pill.is-up { background: color-mix(in srgb, var(--expense) 16%, transparent); color: var(--expense); border-color: color-mix(in srgb, var(--expense) 45%, transparent); }
  .status-pill.is-down { background: color-mix(in srgb, var(--income) 16%, transparent); color: var(--income); border-color: color-mix(in srgb, var(--income) 45%, transparent); }

  /* ============ LEDGER SHEET (transactions view) ============ */
  .ledger-sheet-wrap { overflow: hidden; position: relative; }
  .ledger-group { border-bottom: 1px solid var(--line); }
  .ledger-group:last-child { border-bottom: none; }

  .ledger-group-head {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .4rem;
    padding: .9rem 2.6rem .9rem 1.2rem;
    background: var(--surface-soft);
    position: relative;
    cursor: pointer;
    user-select: none;
    transition: background .15s ease;
  }
  .ledger-group-head:hover { background: color-mix(in srgb, var(--brand) 6%, var(--surface-soft)); }
  .ledger-group-head .date { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
  .ledger-group-head .tot { font-size: .76rem; color: var(--text-soft); }
  .ledger-group-head .tot b { font-family: var(--font-mono); font-weight: 600; }

  .ledger-group-head::after {
    content: "";
    position: absolute;
    right: 1.2rem;
    top: 50%;
    width: .55rem;
    height: .55rem;
    border-right: 2px solid var(--text-soft);
    border-bottom: 2px solid var(--text-soft);
    transform: translateY(-65%) rotate(45deg);
    transition: transform .2s ease;
  }

  .ledger-group.is-collapsed .ledger-group-head::after { transform: translateY(-35%) rotate(-45deg); }
  .ledger-group.is-collapsed .ledger-row { display: none; }

  .ledger-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: 1.1rem;
    padding: .75rem 1.2rem;
    border-top: 1px dashed var(--line-soft);
  }

  .ledger-group .ledger-row:first-of-type { border-top: none; }
  .ledger-row .desc { font-size: .87rem; min-width: 0; }
  .ledger-row .desc span { display: block; color: var(--text-soft); font-size: .72rem; margin-top: .1rem; }
  .ledger-row .debit, .ledger-row .credit { font-family: var(--font-mono); font-size: .87rem; font-weight: 600; text-align: right; width: 5.5rem; }
  .ledger-row .debit { color: var(--expense); }
  .ledger-row .credit { color: var(--income); }
  .ledger-row .debit:empty, .ledger-row .credit:empty { display: none; width: 0; }
  .ledger-row .row-actions { display: flex; gap: .3rem; }

  @media (max-width: 480px) {
    .ledger-row { gap: .6rem; padding: .7rem .9rem; }
    .ledger-row .debit, .ledger-row .credit { width: auto; }
  }

  /* ============ BUDGET GAUGE + ENVELOPES ============ */
  .budget-gauge-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 1.75rem; padding: 1.7rem; margin-bottom: 1.1rem; }
  .budget-gauge { position: relative; width: 9.5rem; height: 9.5rem; flex: none; }
  .budget-gauge svg { width: 100%; height: 100%; }
  .budget-gauge svg circle { transition: stroke-dashoffset .5s ease; }
  .budget-gauge-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .budget-gauge-label b { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; }
  .budget-gauge-label span { font-size: .68rem; color: var(--text-soft); margin-top: .1rem; }
  .budget-gauge-cap p { margin: 0 0 .35rem; color: var(--text-soft); font-size: .82rem; }
  .budget-gauge-cap .big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--ink); }

  .envelope-row { display: flex; gap: 1.1rem; overflow-x: auto; padding: .2rem .2rem .6rem; }

  .envelope {
    flex: 0 0 auto;
    width: 11.5rem;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    padding: 1.3rem .95rem .95rem;
    position: relative;
    box-shadow: var(--shadow-tile);
  }

  .envelope:nth-child(3n+1) { transform: rotate(-.8deg); }
  .envelope:nth-child(3n+2) { transform: rotate(.6deg); }
  .envelope:nth-child(3n+3) { transform: rotate(-.4deg); }

  .envelope::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: .95rem;
    background:
      linear-gradient(135deg, transparent 49%, var(--line) 50%) 0 0/50% 100% no-repeat,
      linear-gradient(-135deg, transparent 49%, var(--line) 50%) 100% 0/50% 100% no-repeat,
      color-mix(in srgb, var(--accent, var(--line)) 22%, var(--surface-soft));
    border-bottom: 1px solid var(--line);
  }

  .envelope-top { display: flex; align-items: center; justify-content: space-between; gap: .4rem; margin-bottom: .6rem; }
  .envelope-actions { display: flex; gap: .2rem; }
  .envelope .cat { margin: 0 0 .3rem; font-size: .84rem; font-weight: 700; }
  .envelope .amt { display: block; font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; }
  .envelope .track { height: .35rem; border-radius: 3px; background: var(--line-soft); overflow: hidden; margin: .55rem 0 .4rem; }
  .envelope .track i { display: block; height: 100%; background: var(--brand); }
  .envelope .track i.warning { background: var(--warning); }
  .envelope .track i.danger { background: var(--danger); }
  .envelope small { color: var(--text-soft); font-size: .7rem; }

  /* ============ BUDGETS ============ */
  .envelope.is-budget { width: 14rem; }
  .envelope.is-over-budget { background: color-mix(in srgb, var(--danger) 8%, var(--surface-raised)); border-color: color-mix(in srgb, var(--danger) 42%, var(--line)); }

  .status-pill.is-ok-pill { background: color-mix(in srgb, var(--income) 18%, transparent); color: color-mix(in srgb, var(--income) 55%, var(--ink)); }
  .status-pill.is-warning-pill { background: color-mix(in srgb, var(--warning) 20%, transparent); color: color-mix(in srgb, var(--warning) 55%, var(--ink)); }
  .status-pill.is-danger-pill { background: color-mix(in srgb, var(--danger) 20%, transparent); color: color-mix(in srgb, var(--danger) 60%, var(--ink)); }

  .budget-days-left { display: inline-flex; align-items: center; gap: .25rem; font-size: .68rem; font-weight: 700; color: var(--text-soft); }
  .budget-days-left svg { width: .8rem; height: .8rem; }

  .order-stepper { display: flex; flex-direction: column; gap: .18rem; flex: 0 0 auto; }
  .order-stepper button {
    display: grid; place-items: center; width: 1.5rem; height: 1.15rem;
    border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text-soft);
    transition: transform .15s ease, border-color .2s ease, color .2s ease;
  }
  .order-stepper button svg { width: .68rem; height: .68rem; }
  .order-stepper button:hover { border-color: var(--brand); color: var(--brand-strong); }
  .order-stepper button[disabled] { opacity: .3; pointer-events: none; }

  /* ---- Budget hero (primary spotlight) ---- */
  .budget-hero {
    display: flex; flex-wrap: wrap; align-items: center; gap: 1.6rem; padding: 1.6rem 1.7rem;
    background-image: radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--warning) 10%, transparent), transparent 60%);
  }
  .budget-hero-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; }
  .budget-hero-title { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; min-width: 0; }
  .budget-hero-title h3 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; }

  .budget-hero-ring-wrap { position: relative; flex: 0 0 auto; display: grid; place-items: center; width: 8rem; height: 8rem; }
  .budget-hero-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .budget-hero-ring-track { fill: none; stroke: var(--line-soft); stroke-width: 9; }
  .budget-hero-ring-fill { fill: none; stroke: var(--brand); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s ease, stroke .3s ease; }
  .budget-hero-ring-fill.is-warning { stroke: var(--warning); }
  .budget-hero-ring-fill.is-danger { stroke: var(--danger); }
  .budget-hero-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .budget-hero-ring-center strong { font-family: var(--font-mono); font-size: 1.3rem; line-height: 1.1; }
  .budget-hero-ring-center span { font-size: .64rem; color: var(--text-soft); font-weight: 700; }

  .budget-hero-stats { flex: 1 1 220px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem 1.5rem; }
  .budget-hero-stat p { margin: 0 0 .2rem; font-size: .68rem; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: .05em; font-family: var(--font-mono); }
  .budget-hero-stat strong { font-family: var(--font-mono); font-size: 1.1rem; }
  .budget-hero-stat strong.is-negative { color: var(--danger); }
  .budget-hero-stat strong.is-warning { color: var(--warning); }

  .budget-hero-risk {
    width: 100%; display: flex; align-items: center; gap: .55rem; padding: .65rem .85rem;
    border-radius: var(--r-md); background: color-mix(in srgb, var(--danger) 10%, transparent);
    color: color-mix(in srgb, var(--danger) 65%, var(--ink)); font-size: .78rem; font-weight: 700;
  }
  .budget-hero-risk.is-ok { background: color-mix(in srgb, var(--income) 12%, transparent); color: color-mix(in srgb, var(--income) 50%, var(--ink)); }
  .budget-hero-risk svg { width: 1.1rem; height: 1.1rem; flex: 0 0 auto; }

  /* ---- Overview strip ---- */
  .budget-overview-strip { display: flex; flex-wrap: wrap; gap: .7rem; }
  .budget-overview-chip {
    flex: 1 1 150px; display: flex; align-items: center; gap: .65rem; padding: .8rem .9rem;
    border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface);
  }
  .budget-overview-chip .ic { display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); flex: 0 0 auto; }
  .budget-overview-chip .ic svg { width: 1.05rem; height: 1.05rem; }
  .budget-overview-chip.is-danger .ic { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .budget-overview-chip p { margin: 0; font-size: .64rem; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: .04em; }
  .budget-overview-chip strong { font-family: var(--font-mono); font-size: 1.05rem; }

  .budget-filter-toggle {
    border: 1px solid var(--line); border-radius: var(--r-pill); padding: .4rem .85rem;
    font-size: .78rem; font-weight: 700; color: var(--text-soft); background: var(--surface);
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  .budget-filter-toggle.active { background: color-mix(in srgb, var(--danger) 16%, transparent); border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: color-mix(in srgb, var(--danger) 65%, var(--ink)); }


  /* ============ SAVINGS GOALS ============ */
  .envelope.is-savings { width: 14.5rem; }
  .envelope.is-goal-complete { background: color-mix(in srgb, var(--income) 9%, var(--surface-raised)); border-color: color-mix(in srgb, var(--income) 45%, var(--line)); }
  .envelope.is-primary-budget { background: color-mix(in srgb, var(--warning) 10%, var(--surface-raised)); border-color: color-mix(in srgb, var(--warning) 50%, var(--line)); }
  .status-pill.is-primary-pill { background: color-mix(in srgb, var(--warning) 20%, transparent); color: color-mix(in srgb, var(--warning) 60%, var(--ink)); border-color: color-mix(in srgb, var(--warning) 55%, transparent); font-weight: 800; }
  .mini-btn[disabled] { opacity: .35; pointer-events: none; }
  .envelope-head-row { display: flex; align-items: center; gap: .7rem; margin-bottom: .5rem; }
  .envelope-head-row .cat { margin: 0 0 .15rem; }
  .envelope-head-row .amt { font-size: 1.05rem; }

  .goal-ring-badge { position: relative; width: 3rem; height: 3rem; flex: 0 0 auto; }
  .goal-ring-badge svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .goal-ring-badge .ring-track { fill: none; stroke: var(--line-soft); stroke-width: 4; }
  .goal-ring-badge .ring-fill { fill: none; stroke: var(--accent, var(--brand)); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
  .goal-ring-badge.warning .ring-fill { stroke: var(--warning); }
  .goal-ring-badge.danger .ring-fill { stroke: var(--danger); }
  .goal-ring-badge.completed .ring-fill { stroke: var(--income); }
  .goal-ring-badge .ring-icon-bg { position: absolute; inset: 5px; border-radius: 50%; background: color-mix(in srgb, var(--accent, var(--brand)) 20%, transparent); }
  .goal-ring-badge .ring-icon { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent, var(--brand-strong)); }
  .goal-ring-badge .ring-icon svg { width: 1.1rem; height: 1.1rem; transform: none; }

  /* ---- Savings hero (overview) ---- */
  .savings-hero {
    display: flex; flex-wrap: wrap; align-items: center; gap: 1.6rem; padding: 1.6rem 1.7rem;
    background-image: radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--brand) 12%, transparent), transparent 60%);
  }
  .savings-hero-ring-wrap { position: relative; flex: 0 0 auto; display: grid; place-items: center; width: 8rem; height: 8rem; }
  .savings-hero-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .savings-hero-ring-track { fill: none; stroke: var(--line-soft); stroke-width: 9; }
  .savings-hero-ring-fill { fill: none; stroke: var(--warning); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .savings-hero-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .savings-hero-ring-center strong { font-family: var(--font-mono); font-size: 1.25rem; line-height: 1.1; }
  .savings-hero-ring-center span { font-size: .64rem; color: var(--text-soft); font-weight: 700; }
  .savings-hero-stats { flex: 1 1 220px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem 1.5rem; }
  .savings-hero-stat p { margin: 0 0 .2rem; font-size: .68rem; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: .05em; font-family: var(--font-mono); }
  .savings-hero-stat strong { font-family: var(--font-mono); font-size: 1.1rem; }
  .savings-hero-stat strong.is-negative { color: var(--danger); }

  /* ---- Sort / filter toolbar ---- */
  .savings-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
  .savings-sort-select { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-size: .8rem; font-weight: 700; padding: .5rem .7rem; }

  /* ---- Icon picker (goal form) ---- */
  .icon-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
  .icon-picker button { display: grid; place-items: center; aspect-ratio: 1; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); color: var(--text-soft); transition: border-color .2s ease, color .2s ease, background .2s ease; }
  .icon-picker button svg { width: 1.1rem; height: 1.1rem; }
  .icon-picker button:hover { border-color: var(--brand); color: var(--brand-strong); }
  .icon-picker button.active { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-fill-ink); }

  /* ---- Color picker (category form) ---- */
  .color-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
  .color-picker button { position: relative; aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .color-picker button.active { border-color: var(--ink); }
  .color-picker button.active::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--ink); }
  .dark .color-picker button.active,
  .dark .color-picker button.active::after { border-color: #f6f0dd; }

  /* ---- Category manager list (Settings) — single bordered list, like a settings group ---- */
  .settings-list { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
  .category-row { display: flex; align-items: center; gap: .7rem; padding: .8rem .9rem; border-bottom: 1px solid var(--line); }
  .category-row:last-child { border-bottom: none; }
  .category-row .swatch { display: grid; place-items: center; width: 2.3rem; height: 2.3rem; border-radius: 50%; flex: 0 0 auto; color: #fff; }
  .category-row .swatch svg { width: 1.05rem; height: 1.05rem; }
  .category-row .name { flex: 1 1 auto; font-weight: 700; min-width: 0; }
  .category-row .actions { display: flex; align-items: center; gap: .3rem; flex: 0 0 auto; }

  /* ---- Quick amount chips (deposit/withdraw modal) ---- */
  .quick-amount-row { display: flex; flex-wrap: wrap; gap: .45rem; }
  .quick-amount-chip { border: 1px solid var(--line); border-radius: var(--r-pill); padding: .42rem .9rem; font-size: .78rem; font-weight: 700; color: var(--text-soft); background: var(--surface); transition: transform .15s ease, border-color .2s ease, color .2s ease, background .2s ease; }
  .quick-amount-chip:hover { transform: translateY(-1px); border-color: var(--brand); color: var(--brand-strong); }
  .quick-amount-chip.is-max { border-style: dashed; }

  /* ---- Savings log filter bar ---- */
  .log-filter-bar { display: flex; flex-wrap: wrap; gap: .55rem; margin-bottom: 1rem; }
  .log-filter-bar input[type="search"] { flex: 1 1 160px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: .55rem .8rem; font-size: .85rem; color: var(--ink); }
  .log-filter-chip { border: 1px solid var(--line); border-radius: var(--r-pill); padding: .4rem .85rem; font-size: .78rem; font-weight: 700; color: var(--text-soft); background: var(--surface); }
  .log-filter-chip.active { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-fill-ink); }

  /* ---- Goal completion celebration ---- */
  .confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
  .confetti-piece { position: absolute; top: -12px; width: 8px; height: 14px; opacity: .95; animation: confetti-fall 1.6s ease-in forwards; border-radius: 2px; }
  @keyframes confetti-fall { to { transform: translateY(110vh) rotate(540deg); opacity: 0; } }

  .envelope-actions-row { display: flex; gap: .4rem; margin-top: .75rem; }
  .mini-btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: .3rem;
    padding: .42rem .5rem; border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--surface-soft); color: var(--ink); font-size: .72rem; font-weight: 700;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease, color .15s ease;
    font-family: var(--font-body);
  }
  .mini-btn:hover { border-color: var(--brand); color: var(--brand-strong); transform: translateY(-1px); }
  .mini-btn.is-withdraw:hover { border-color: var(--warning); color: var(--warning); }
  .mini-btn svg { width: .8rem; height: .8rem; }

  /* ============ RECURRING ============ */
  .next-ticket { display: flex; align-items: center; gap: 1.3rem; padding: 1.35rem 1.7rem; margin-bottom: 1.1rem; position: relative; }
  .next-ticket::after { content: ""; position: absolute; right: 10.9rem; top: 0; bottom: 0; border-left: 2px dashed var(--line); }
  @media (max-width: 560px) { .next-ticket::after { display: none; } .next-ticket { flex-wrap: wrap; } }

  .next-days { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: .35rem; }
  .next-days span { font-size: .78rem; color: var(--text-soft); font-family: var(--font-body); }
  .next-info { flex: 1; min-width: 0; }
  .next-info .cat { margin: 0; font-weight: 700; font-size: .96rem; }
  .next-info .sub { margin: .15rem 0 0; color: var(--text-soft); font-size: .78rem; }
  .next-amt { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 600; padding-left: 1rem; }

  .timeline-card { padding: 1.6rem 1.7rem; }
  .recurring-timeline { position: relative; padding-left: 1.6rem; }
  .recurring-timeline::before { content: ""; position: absolute; left: .3rem; top: .4rem; bottom: .4rem; width: 1px; background: var(--margin-rule); opacity: .55; }
  .tl-item { position: relative; display: flex; align-items: center; gap: .9rem; padding: .65rem 0 .65rem .8rem; }
  .tl-item::before { content: ""; position: absolute; left: -1.6rem; top: 1.1rem; width: .55rem; height: .55rem; border-radius: 50%; background: var(--surface); border: 2px solid var(--brand); }
  .tl-item .d { width: 4.6rem; flex: none; font-size: .72rem; color: var(--text-soft); font-family: var(--font-mono); }
  .tl-item .c { flex: 1; min-width: 0; font-size: .85rem; }
  .tl-item .c small { display: block; color: var(--text-soft); font-size: .72rem; margin-top: .1rem; }
  .tl-item .a { font-family: var(--font-mono); font-size: .85rem; font-weight: 600; }

  .add-panel { border: 1.5px dashed var(--line); background: var(--surface-soft); padding: 1.45rem 1.6rem; margin-top: 1.1rem; box-shadow: none; }
  .add-panel h3 { margin: 0 0 1rem; font-size: .82rem; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: .06em; font-family: var(--font-mono); }

  /* ============ ANALYTICS ============ */
  .chart-hero { padding: 1.7rem; margin-bottom: 1.1rem; }
  .chart-hero canvas { max-height: 24rem; }
  .trend-mini { padding: 1.35rem 1.7rem 1.55rem; margin-top: 1.1rem; }
  .trend-mini canvas { max-height: 12rem; }

  .ticker-row { display: flex; overflow: hidden; border-radius: var(--r-md); border: 1px dashed var(--line); }
  @media (max-width: 640px) { .ticker-row { flex-direction: column; } }
  .ticker-row article { flex: 1; display: flex; flex-direction: column; gap: .3rem; padding: 1.15rem 1.35rem; border-right: 1px dashed var(--line); }
  .ticker-row article:last-child { border-right: none; }
  @media (max-width: 640px) {
    .ticker-row article { border-right: none; border-top: 1px dashed var(--line); }
    .ticker-row article:first-child { border-top: none; }
  }
  .ticker-row .l { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-soft); font-weight: 700; font-family: var(--font-mono); }
  .ticker-row .v { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 600; }
  .ticker-row .v.up { color: var(--expense); }
  .ticker-row .v.down { color: var(--income); }
  .ticker-row .cap { margin: 0; font-size: .76rem; color: var(--text-soft); }

  /* ---- Analytics: chapter headers for clear separation ---- */
  .analytics-chapter-head { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1.3rem; }

  .chapter-no {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 2.9rem;
    height: 2.9rem;
    border-radius: 50%;
    border: 1.5px dashed var(--brand);
    background: var(--brand-soft);
    color: var(--brand-strong);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.3rem;
  }

  .analytics-chapter-head .card-kicker { display: block; margin-bottom: .2rem; }
  .analytics-chapter-head .panel-title { margin: 0; }

  /* ---- Analytics: category breakdown list (pairs with the donut legend colors) ---- */
  .cat-breakdown-list { display: grid; }

  .cat-row {
    display: flex;
    align-items: center;
    gap: .65rem;
    padding: .6rem 0;
    border-top: 1px dashed var(--line-soft);
  }

  .cat-row:first-child { border-top: none; }
  .cat-row .dot { width: .65rem; height: .65rem; border-radius: 50%; flex: 0 0 auto; }
  .cat-row .name { flex: 1; min-width: 0; font-size: .85rem; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-row .amt { font-family: var(--font-mono); font-weight: 600; font-size: .84rem; }
  .cat-row .pct { color: var(--text-soft); font-size: .72rem; width: 2.7rem; text-align: right; font-family: var(--font-mono); }

  /* ---- Analytics: budget overspend stats ---- */
  .overspend-list { display: grid; gap: 1rem; }

  .overspend-card {
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 1rem 1.15rem;
  }

  .overspend-card-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: .2rem; }
  .overspend-card-head .name { font-size: .92rem; font-weight: 700; }
  .overspend-card-head .status-pill.danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
  .overspend-card-head .status-pill.ok { background: color-mix(in srgb, var(--income) 16%, transparent); color: var(--income); border-color: color-mix(in srgb, var(--income) 45%, transparent); }

  .overspend-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; margin-top: .8rem; }
  @media (max-width: 640px) { .overspend-grid { grid-template-columns: repeat(2, 1fr); } }

  .overspend-stat { display: flex; flex-direction: column; gap: .15rem; }
  .overspend-stat .lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-soft); font-weight: 700; font-family: var(--font-mono); }
  .overspend-stat .val { font-family: var(--font-mono); font-size: 1.02rem; font-weight: 650; }
  .overspend-stat .val.danger { color: var(--danger); }

  .overspend-note { margin: .75rem 0 0; font-size: .76rem; color: var(--text-soft); }

  /* ============ SETTINGS: index tabs ============ */
  .idx-wrap { display: grid; grid-template-columns: 12.5rem 1fr; overflow: hidden; }
  @media (max-width: 700px) { .idx-wrap { grid-template-columns: 1fr; } }

  .idx-rail { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface-soft); }
  @media (max-width: 700px) { .idx-rail { flex-direction: row; border-right: none; border-bottom: 1px solid var(--line); overflow-x: auto; } }

  .idx-item { display: flex; align-items: baseline; gap: .6rem; padding: 1.05rem 1.1rem; color: var(--text-soft); font-size: .87rem; font-weight: 600; white-space: nowrap; text-align: left; position: relative; }
  .idx-item b { font-family: var(--font-mono); font-size: .7rem; color: var(--brand); }
  .idx-item.active { color: var(--ink); background: var(--surface); }
  .idx-item.active::before { content: ""; position: absolute; left: 0; top: .5rem; bottom: .5rem; width: 3px; background: var(--warning); }

  .idx-content { padding: 1.7rem; min-width: 0; }
  .idx-content h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; margin: 0 0 1.1rem; }

  /* ============ FORMS / SEGMENTED ============ */
  .transaction-form { display: grid; gap: 1rem; }
  .transaction-form.compact { gap: .8rem; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }

  .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; border-radius: var(--r-sm); background: var(--surface-soft); padding: .3rem; border: 1px solid var(--line); }
  .segmented button { border-radius: calc(var(--r-sm) - 2px); padding: .65rem; font-weight: 700; color: var(--text-soft); font-size: .88rem; }
  .segmented button.active { background: var(--surface-raised); color: var(--brand-strong); box-shadow: var(--shadow-segmented); }
  .segmented.cols-3 { grid-template-columns: repeat(3, 1fr); }

  /* ============ LIST ROWS ============ */
  .transaction-row {
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-soft);
    padding: .85rem .95rem;
    transition: border-color .15s ease, background .15s ease;
  }

  .transaction-row:hover { border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); }

  .transaction-icon { display: grid; width: 2.6rem; height: 2.6rem; flex: 0 0 auto; place-items: center; border-radius: 50%; }
  .transaction-icon.income { background: color-mix(in srgb, var(--income) 16%, transparent); color: var(--income); }
  .transaction-icon.expense { background: color-mix(in srgb, var(--expense) 16%, transparent); color: var(--expense); }

  .amount-income, .amount-expense { font-family: var(--font-mono); font-weight: 600; letter-spacing: -.01em; }
  .amount-income { color: var(--income); }
  .amount-expense { color: var(--expense); }

  #monthIncome, #monthExpense, #monthBalance, #budgetSpent, #streakDays {
    font-family: var(--font-mono); font-weight: 600; letter-spacing: -.01em;
  }

  #viewTitle, #authScreen h1, .auth-card h2 { font-family: var(--font-display); font-weight: 700; }

  .search-wrap { display: flex; align-items: center; gap: .5rem; border: none; border-bottom: 1.5px solid var(--line); border-radius: 0; background: transparent; padding-left: .1rem; }
  .search-wrap svg { width: 1rem; height: 1rem; color: var(--text-soft); flex: 0 0 auto; }
  .search-wrap input { border: 0; background: transparent; padding-left: 0; }

  .mag-spread { display: grid; grid-template-columns: 1.6fr 1fr; gap: 0; overflow: hidden; }
  @media (max-width: 860px) { .mag-spread { grid-template-columns: 1fr; } }
  .mag-focal { padding: 1.7rem; border-right: 1px solid var(--line); min-width: 0; }
  @media (max-width: 860px) { .mag-focal { border-right: none; border-bottom: 1px solid var(--line); } }
  .mag-rail { padding: 1.7rem 1.5rem; background: var(--surface-soft); }
  .mag-focal canvas { max-height: 22rem; }
  .rail-chart { max-height: 12rem; }

  .list-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; }

  /* ============ SETTINGS: switches ============ */
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-soft); padding: .95rem 1.05rem; }
  .switch-row small { display: block; margin-top: .2rem; color: var(--text-soft); }

  input[type="checkbox"] {
    width: 2.7rem; height: 1.5rem; flex: 0 0 auto;
    appearance: none;
    border-radius: var(--r-pill);
    background: var(--neutral-grey);
    cursor: pointer;
    position: relative;
    transition: background .2s ease;
    border: 1px solid var(--line);
  }

  input[type="checkbox"]::after {
    content: "";
    position: absolute;
    top: .18rem; left: .18rem;
    width: 1.1rem; height: 1.1rem;
    border-radius: var(--r-pill);
    background: #fff;
    transition: transform .2s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }

  input[type="checkbox"]:checked { background: var(--brand); }
  input[type="checkbox"]:checked::after { transform: translateX(1.2rem); }

  /* ============ MOBILE NAV / FAB — torn paper strip with center dock ============ */
  .mobile-nav {
    position: fixed;
    inset: auto .6rem calc(.6rem + env(safe-area-inset-bottom));
    z-index: 40;
    display: grid;
    grid-template-columns: repeat(3, 1fr) 3.9rem repeat(3, 1fr);
    align-items: stretch;
    gap: .15rem;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 96%, transparent);
    padding: .45rem .5rem;
    box-shadow: var(--shadow-fab);
    backdrop-filter: blur(16px);
  }

  @media (min-width: 1024px) { .mobile-nav { display: none; } }

  .mobile-nav-item {
    display: flex; min-width: 0; flex-direction: column; align-items: center; justify-content: center;
    gap: .22rem; border-radius: 13px; padding: .4rem .1rem;
    color: var(--text-soft); font-size: .6rem; font-weight: 700;
    transition: color .2s ease, background .2s ease;
  }
  .mobile-nav-item .lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mobile-nav-item .ic {
    display: grid; place-items: center; width: 2.05rem; height: 1.7rem;
    border-radius: var(--r-pill); transition: background .2s ease, transform .2s ease;
  }
  .mobile-nav-item .ic svg { transition: transform .2s ease; }
  .mobile-nav-item.active { color: var(--brand-strong); }
  .mobile-nav-item.active .ic { background: var(--brand-soft); transform: translateY(-1px); }
  .mobile-nav-item.active .ic svg { transform: scale(1.08); }
  .mobile-nav-item:active .ic { transform: scale(.92); }
  .dark .mobile-nav-item.active { color: var(--brand); }

  .mobile-nav-slot { display: block; }

  .fab-add {
    position: fixed;
    left: 50%;
    bottom: calc(1.2rem + env(safe-area-inset-bottom));
    z-index: 45;
    display: grid;
    width: 3.7rem; height: 3.7rem;
    place-items: center;
    border: 4px solid var(--surface-soft);
    border-radius: 50%;
    background: var(--warning);
    color: #241d0f;
    box-shadow: var(--shadow-fab);
    transform: translateX(-50%);
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
  }
  .fab-add svg { width: 1.5rem; height: 1.5rem; }

  .fab-add:hover { transform: translateX(-50%) translateY(-2px); }
  .fab-add:active { transform: translateX(-50%) scale(.94); }

  @media (min-width: 1024px) { .fab-add { bottom: 2rem; left: calc(50% + var(--sidebar-w) / 2); } }

  /* ============ MODALS — index cards ============ */
  .modal-backdrop { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: var(--bg-modal-backdrop); padding: 1rem; backdrop-filter: blur(3px); }
  .modal-backdrop.hidden { display: none; }

  .transaction-modal {
    width: min(100%, 30rem);
    max-height: calc(100vh - 2rem);
    overflow-y: auto;
    scrollbar-gutter: stable;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface-raised);
    padding: 1.15rem;
    box-shadow: var(--shadow-lg);
    position: relative;
  }

  .transaction-modal::before {
    content: "";
    position: absolute;
    top: -.55rem; left: 50%; transform: translateX(-50%) rotate(-2deg);
    width: 3.6rem; height: 1.15rem;
    background: color-mix(in srgb, var(--warning) 50%, transparent);
    border: 1px solid color-mix(in srgb, var(--warning) 70%, var(--line));
    opacity: .85;
  }

  @media (min-width: 640px) { .transaction-modal { padding: 1.6rem; } }

  .ocr-modal { width: min(100%, 42rem); }

  .entry-method-grid { display: grid; gap: .7rem; }
  .entry-method-card {
    display: grid; grid-template-columns: auto 1fr; gap: .2rem .85rem; align-items: center;
    width: 100%;
    border: 1.5px dashed var(--line);
    border-radius: var(--r-md);
    background: var(--surface-soft);
    padding: 1rem;
    text-align: left;
    transition: border-color .2s ease, transform .15s ease, background .2s ease;
  }

  .entry-method-card:hover { border-color: var(--brand); border-style: solid; background: color-mix(in srgb, var(--brand) 8%, var(--surface-soft)); transform: translateY(-1px); }
  .entry-method-card svg { grid-row: span 2; width: 1.4rem; height: 1.4rem; color: var(--brand-strong); }
  .entry-method-card strong { font-size: .98rem; font-weight: 700; }
  .entry-method-card span { color: var(--text-soft); font-size: .81rem; font-weight: 600; }

  .voice-input-row { display: grid; grid-template-columns: 1fr auto; gap: .55rem; }
