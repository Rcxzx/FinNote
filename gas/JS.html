  function budgetIconFor(cat) {
    if (!cat) return 'layout-grid';
    const m = (App.data && App.data.categories && App.data.categories.expense || []).find((i) => i.name === cat);
    return m ? m.icon : (BUDGET_CATEGORY_ICONS[cat] || 'tag');
  }

  function categoryColorFor(cat) {
    if (!cat) return '';
    const m = (App.data && App.data.categories && App.data.categories.expense || []).find((i) => i.name === cat);
    return m ? m.color : '';
  }

  function colorForSeed(seed) {
    let hash = 0;
    const str = String(seed || '');
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return CATEGORY_COLORS[hash % CATEGORY_COLORS.length];
  }

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    setTodayLabel();
    applyTheme(document.documentElement.classList.contains('dark'));
    watchSystemTheme();
    bindGlobalEvents();
    renderTransactionForm('transactionModalForm', 'modal');

    renderIcons();
    setInterval(silentRefresh, 60000);

    if (App.token) {
      loadAppData();
    } else if (App.rememberToken) {
      resumeSession();
    } else {
      showAuth();
    }
  }

  function callApi_(name, ...args) {
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('ต้องเปิดผ่าน Google Apps Script Web App'));
        return;
      }
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);
    });
  }

  let sessionResumePromise_ = null;
  function resumeSessionOnce_() {
    if (!sessionResumePromise_) {
      sessionResumePromise_ = callApi_('resumeSession', App.rememberToken)
        .then((res) => { applySessionResult(res); return res; })
        .finally(() => { sessionResumePromise_ = null; });
    }
    return sessionResumePromise_;
  }

  async function api(name, ...args) {
    try {
      return await callApi_(name, ...args);
    } catch (err) {
      const isExpired = err && String(err.message || '').includes('เซสชันหมดอายุ');
      if (isExpired && App.rememberToken && name !== 'resumeSession' && name !== 'loginUser') {
        try {
          await resumeSessionOnce_();
          const retryArgs = args.map((a) => (a === args[0] ? App.token : a));
          return callApi_(name, ...retryArgs);
        } catch {
          localStorage.removeItem('moneyflow_remember');
          App.rememberToken = '';
          App.token = '';
          showAuth();
          throw err;
        }
      }
      throw err;
    }
  }

  async function loadAppData() {
    setLoading(true);
    try {
      App.data = await api('getAppData', App.token);
      showApp();
      renderAll();
    } catch (err) {
      sessionStorage.removeItem('moneyflow_session');
      App.token = '';
      if (App.rememberToken) {
        setLoading(false);
        await resumeSession();
        return;
      }
      showAuth();
      showToast(err.message || 'เซสชันหมดอายุ', true);
    } finally {
      setLoading(false);
    }
  }

  async function resumeSession() {
    setLoading(true);
    try {
      await resumeSessionOnce_();
    } catch {
      localStorage.removeItem('moneyflow_remember');
      App.rememberToken = '';
      showAuth();
    } finally {
      setLoading(false);
    }
  }

  function applySessionResult(result) {
    App.token = result.token;
    App.data = result.data;
    sessionStorage.setItem('moneyflow_session', App.token);
    if (result.rememberToken) {
      App.rememberToken = result.rememberToken;
      localStorage.setItem('moneyflow_remember', App.rememberToken);
    }
    showApp();
    renderAll();
  }

  let silentRefreshBusy_ = false;
  async function silentRefresh() {
    if (!App.token || !App.data || silentRefreshBusy_) return;
    silentRefreshBusy_ = true;
    try {
      App.data = await api('getAppData', App.token);
      renderAll();
    } catch (err) {
      console.warn(err);
    } finally {
      silentRefreshBusy_ = false;
    }
  }

  function showAuth() {
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('appShell').classList.add('hidden');
    renderIcons();
  }

  function showApp() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appShell').classList.remove('hidden');
  }

  function setAuthMode(mode) {
    App.authMode = mode;
    App.forgotStep = 'email';
    App.pendingEmailVerification = false;
    refreshAuthFormUI();
    const firstField = mode === 'forgot' ? '#email' : (mode === 'register' ? '#displayName' : '#email');
    const el = document.querySelector(firstField);
    if (el) el.focus();
  }

  function refreshAuthFormUI() {
    const isReg = App.authMode === 'register';
    const isForg = App.authMode === 'forgot';
    const isReset = isForg && App.forgotStep === 'reset';

    document.getElementById('displayNameWrap').classList.toggle('hidden', !isReg);
    document.getElementById('passwordWrap').classList.toggle('hidden', isForg);
    document.getElementById('pinWrap').classList.toggle('hidden', !(isReg && App.pendingEmailVerification));
    document.getElementById('forgotPinWrap').classList.toggle('hidden', !isReset);
    document.getElementById('forgotNewPasswordWrap').classList.toggle('hidden', !isReset);
    document.getElementById('authModeToggle').classList.toggle('hidden', isForg);
    document.getElementById('backToLoginBtn').classList.toggle('hidden', !isForg);

    let label = '<i data-lucide="log-in"></i><span>เข้าสู่ระบบ</span>';
    if (isReg) label = '<i data-lucide="user-plus"></i><span>สมัครสมาชิก</span>';
    if (isForg) {
      label = isReset ? '<i data-lucide="key-round"></i><span>ตั้งรหัสผ่านใหม่</span>' : '<i data-lucide="mail"></i><span>ส่ง PIN ไปทางอีเมล</span>';
    }
    document.getElementById('authSubmit').innerHTML = label;
    document.getElementById('authModeToggle').innerHTML = isReg ? '<i data-lucide="log-in"></i><span>เข้าสู่ระบบ</span>' : '<i data-lucide="user-plus"></i><span>สมัคร</span>';
    renderIcons();
  }

  function toggleAuthMode() {
    setAuthMode(App.authMode === 'login' ? 'register' : 'login');
  }

  async function submitAuth(e) {
    e.preventDefault();
    if (App.authMode === 'forgot') {
      await submitForgotPassword();
      return;
    }
    const pinVal = document.getElementById('emailPin').value.trim();
    if (App.authMode === 'register' && App.pendingEmailVerification && !pinVal) {
      showToast('กรุณากรอก PIN ที่ได้รับทางอีเมล', true);
      document.getElementById('emailPin').focus();
      return;
    }
    const payload = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      displayName: document.getElementById('displayName').value,
      pin: App.pendingEmailVerification ? pinVal : '',
    };
    setLoading(true);
    try {
      const result = await api(App.authMode === 'register' ? 'registerUser' : 'loginUser', payload);
      if (result.requiresPin) {
        App.pendingEmailVerification = true;
        document.getElementById('pinWrap').classList.remove('hidden');
        document.getElementById('authSubmit').innerHTML = '<i data-lucide="shield-check"></i><span>ยืนยัน PIN</span>';
        document.getElementById('emailPin').focus();
        showToast(result.message || 'ส่ง PIN ไปยังอีเมลแล้ว');
        renderIcons();
        return;
      }
      App.pendingEmailVerification = false;
      applySessionResult(result);
    } catch (err) {
      showToast(err.message || 'ไม่สามารถเข้าสู่ระบบได้', true);
    } finally {
      setLoading(false);
    }
  }

  async function submitForgotPassword() {
    const email = document.getElementById('email').value.trim();
    if (!email) {
      showToast('กรุณากรอกอีเมล', true);
      return;
    }
    setLoading(true);
    try {
      if (App.forgotStep === 'email') {
        const result = await api('requestPasswordReset', email);
        showToast(result.message || 'ส่ง PIN ไปยังอีเมลแล้ว');
        App.forgotStep = 'reset';
        refreshAuthFormUI();
        document.getElementById('forgotPin').focus();
      } else {
        const pin = document.getElementById('forgotPin').value.trim();
        const newPassword = document.getElementById('forgotNewPassword').value;
        if (!pin || !newPassword) {
          showToast('กรุณากรอก PIN และรหัสผ่านใหม่ให้ครบ', true);
          return;
        }
        const result = await api('resetPasswordWithPin', { email, pin, newPassword });
        showToast('ตั้งรหัสผ่านใหม่เรียบร้อย เข้าสู่ระบบให้อัตโนมัติ');
        setAuthMode('login');
        applySessionResult(result);
      }
    } catch (err) {
      showToast(err.message || 'ดำเนินการไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  async function logout() {
    setLoading(true);
    try {
      if (App.token) await api('logoutUser', App.token);
    } catch (err) {
      console.warn(err);
    } finally {
      sessionStorage.removeItem('moneyflow_session');
      localStorage.removeItem('moneyflow_remember');
      App.token = '';
      App.rememberToken = '';
      App.data = null;
      setLoading(false);
      showAuth();
    }
  }

  function renderAll() {
    if (!App.data) return;
    syncCategoriesFromData();
    populateBudgetCategoryOptions();
    renderProfile();
    renderDashboard();
    renderTransactions();
    renderBudgets();
    renderSavings();
    renderRecurring();
    renderAnalytics();
    hydrateSettings();
    renderCategoryManager();
    renderIcons();
  }

  function syncCategoriesFromData() {
    const cats = App.data.categories || { expense: [], income: [] };
    App.categories.expense = cats.expense.map((i) => i.name);
    App.categories.income = cats.income.map((i) => i.name);
  }

  function setView(view) {
    App.view = view;
    const titles = {
      dashboard: 'แดชบอร์ด', transactions: 'ประวัติรายการ', budget: 'งบประมาณ',
      savings: 'เงินออม', recurring: 'รายการประจำ', analytics: 'สถิติ', settings: 'ตั้งค่า',
    };
    document.querySelectorAll('.view-section').forEach((s) => s.classList.add('hidden'));
    document.getElementById(view + 'View').classList.remove('hidden');
    document.getElementById('viewTitle').textContent = titles[view] || 'FinNote';
    document.querySelectorAll('.nav-item, .mobile-nav-item').forEach((i) => i.classList.toggle('active', i.dataset.view === view));
    document.getElementById('profileChipBtn').classList.toggle('active', view === 'settings');
    if (view === 'analytics') setTimeout(renderAnalytics, 60);
    renderIcons();
  }

  function toggleTheme() {
    const isDark = !document.documentElement.classList.contains('dark');
    try { localStorage.setItem('moneyflow-theme', isDark ? 'dark' : 'light'); } catch {}
    applyTheme(isDark);
    if (App.data) {
      renderDashboard();
      if (App.view === 'analytics') renderAnalytics();
    }
  }

  function applyTheme(isDark) {
    document.documentElement.classList.toggle('dark', Boolean(isDark));
    document.getElementById('themeToggle').innerHTML = isDark ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
    syncChartTheme();
    renderIcons();
  }

  function watchSystemTheme() {
    if (!window.matchMedia) return;

  function detectNlpCategory(type, itemName) {
    try {
      const learned = JSON.parse(localStorage.getItem('moneyflow_learned_categories') || '{}');
      const key = `${type}:${String(itemName || '').trim().toLowerCase()}`;
      if (learned[key]) return learned[key];
    } catch {}
    const dict = NLP_CATEGORY_KEYWORDS[type] || {};
    const lower = String(itemName || '').toLowerCase();
    for (const [cat, words] of Object.entries(dict)) {
      if (words.some((w) => lower.includes(w.toLowerCase()))) return cat;
    }
    return 'อื่นๆ';
  }

  function parseNlpCommands(text) {
    const tokens = String(text || '').trim().replace(/[,;|]+/g, ' ').split(/\s+/).filter(Boolean);
    const items = [];
    let names = [];
    const date = document.getElementById('nlpDate').value || today();
    const time = document.getElementById('nlpTime').value || currentTime();
    const type = document.getElementById('nlpType').value;

    tokens.forEach((token) => {
      const cleaned = token.replace(/[฿,]/g, '').replace(/บาท$/i, '');
      const num = /^\d+(?:\.\d+)?$/.test(cleaned) ? Number(cleaned) : null;
      if (num && num > 0) {
        const itemName = names.join(' ').replace(/^(ซื้อ|จ่าย|ค่า|รับ|ได้เงิน)\s+/i, '').trim() || 'อื่นๆ';
        items.push({ type, amount: num, itemName, category: detectNlpCategory(type, itemName), note: itemName, date, time, source: 'nlp' });
        names = [];
      } else {
        names.push(token);
      }
    });
    if (!items.length) throw new Error('กรุณาพิมพ์ชื่อรายการและราคา เช่น ข้าวผัด 50 กาแฟ 45');
    return items;
  }

  }

  async function handleOcrFiles(fileList) {
    const files = Array.from(fileList || []).filter((f) => f.type.startsWith('image/'));
    if (!files.length) return;
    if (!window.Tesseract) return showToast('OCR library ยังไม่พร้อม กรุณาลองใหม่', true);

    document.getElementById('ocrStatus').textContent = `กำลังอ่าน ${files.length} รูป...`;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      try {
        const res = await Tesseract.recognize(file, 'tha+eng');
        const text = res.data.text || '';
        const match = text.match(/(?:ยอด|จำนวน|รวม|โอน|ชำระ|total|amount)?\s*(?:฿|บาท|THB)?\s*(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/i);
        const amount = match ? Number(match[1].replace(/,/g, '')) : 0;
        App.ocrItems.push({
          type: 'expense',
          category: file.name.replace(/\.[^.]+$/, '').slice(0, 50) || 'สลิป',
          amount: amount > 0 && amount < 10000000 ? amount : 0,
          date: today(),
          time: currentTime(),
          note: `OCR: ${file.name}`,
          source: 'ocr',
        });
      } catch {
        App.ocrItems.push({ type: 'expense', category: 'สลิป', amount: 0, date: today(), time: '', note: file.name, source: 'ocr' });
      }
      renderOcrReviewList();
    }
    document.getElementById('ocrStatus').textContent = `อ่านเสร็จแล้ว ${files.length} รูป ตรวจสอบก่อนบันทึก`;
  }

  function parseDateVal(val) {
    const p = String(val).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  function renderTransactions() {
    const list = document.getElementById('transactionList');
    const q = document.getElementById('transactionSearch').value.trim().toLowerCase();
    const items = (App.data.transactions || []).filter((t) => !q || `${t.category} ${t.note} ${t.date}`.toLowerCase().includes(q));
    if (!items.length) {
      list.innerHTML = emptyHtml('ยังไม่มีรายการ');
      return;
    }

    const groups = {};
    items.forEach((tx) => {
      let key = tx.date;
      if (App.historyGroup === 'week') {
        const d = parseDateVal(tx.date);
        d.setDate(d.getDate() - d.getDay());
        key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      } else if (App.historyGroup === 'month') {
        key = tx.date.slice(0, 7) + '-01';
      }
      if (!groups[key]) groups[key] = { key, income: 0, expense: 0, items: [] };
      if (tx.type === 'income') groups[key].income += Number(tx.amount || 0);
      else groups[key].expense += Number(tx.amount || 0);
      groups[key].items.push(tx);
    });

    const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));
    list.innerHTML = sortedKeys.map((k) => {
      const g = groups[k];
      const net = g.income - g.expense;
      const label = dateDisplay(k);
      const rows = g.items.map((tx) => `
        <div class="ledger-row" data-tx-id="${tx.transactionId}">
          <div class="desc">${escapeHtml(tx.category)}<span>${dateDisplay(tx.date)} ${timeDisplay(tx.createdAt) ? '· ' + timeDisplay(tx.createdAt) + ' น.' : ''} ${tx.note ? '· ' + escapeHtml(tx.note) : ''}</span></div>
          <div class="debit">${tx.type === 'expense' ? money(tx.amount) : ''}</div>
          <div class="credit">${tx.type === 'income' ? money(tx.amount) : ''}</div>
          <div class="row-actions">
            <button class="icon-chip-sm" data-edit-tx="${tx.transactionId}" type="button" title="แก้ไข"><i data-lucide="pencil"></i></button>
            <button class="icon-chip-sm danger" data-delete-tx="${tx.transactionId}" type="button" title="ลบ"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      `).join('');
      return `
        <div class="ledger-group">
          <div class="ledger-group-head">
            <div><span class="date">${escapeHtml(label)}</span></div>
            <div class="tot">สุทธิช่วงนี้ <b class="${net >= 0 ? 'amount-income' : 'amount-expense'}">${net >= 0 ? '+' : ''}${money(net)}</b></div>
          </div>
          ${rows}
        </div>
      `;
    }).join('');

    bindTransactionDelete(list);
    renderIcons();
  }

  function transactionRowHtml(tx) {
    const isInc = tx.type === 'income';
    return `
      <div class="transaction-row">
        <div class="flex min-w-0 items-center gap-3">
          <div class="transaction-icon ${isInc ? 'income' : 'expense'}"><i data-lucide="${isInc ? 'arrow-down-left' : 'arrow-up-right'}"></i></div>
          <div class="min-w-0">
            <p class="truncate font-extrabold">${escapeHtml(tx.category)}</p>
            <p class="text-xs text-slate-500 dark:text-slate-400">${dateDisplay(tx.date)}</p>
          </div>

  function populateBudgetCategoryOptions(selectedCategory) {
    const select = document.getElementById('budgetCategory');
    if (!select) return;
    const cats = (App.categories && App.categories.expense ? App.categories.expense : []).slice();
    if (selectedCategory && !cats.includes(selectedCategory)) {
      cats.push(selectedCategory);
    }
    if (!cats.length) {
      cats.push('ทั่วไป', 'อาหาร', 'เดินทาง', 'ช้อปปิ้ง', 'ที่พัก', 'บิลค่าน้ำไฟ');
    }
    select.innerHTML = cats.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if (selectedCategory) select.value = selectedCategory;

  async function submitBudget(e) {
    e.preventDefault();
    const scope = document.getElementById('budgetScope').value;
    const amountVal = Number(document.getElementById('budgetAmount').value);
    if (!amountVal || amountVal <= 0) {
      showToast('กรุณากรอกวงเงินที่มากกว่า 0', true);
      return;
    }
    const payload = {
      period: document.getElementById('budgetPeriod').value,
      amount: amountVal,
      startDate: document.getElementById('budgetStart').value || today(),
      category: scope === 'category' ? document.getElementById('budgetCategory').value : '',
    };
    const editingId = document.getElementById('budgetEditingId').value;
    setLoading(true);
    try {
      App.data = editingId ? await api('updateBudget', App.token, editingId, payload) : await api('saveBudget', App.token, payload);
      closeBudgetFormModal();
      renderAll();
      showToast(editingId ? 'แก้ไขงบประมาณแล้ว' : 'บันทึกงบประมาณแล้ว');
    } catch (err) {
      showToast(err.message || 'บันทึกงบไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  function renderBudgets() {
    const primary = App.data.budget;
    const budgets = App.data.budgets || [];
    const ringFill = document.getElementById('budgetHeroRingFill');
    const circ = 2 * Math.PI * 52;
    ringFill.style.strokeDasharray = circ;

    if (primary && primary.amount > 0) {
      const ratio = Math.max(0, primary.ratio || 0);
      ringFill.style.strokeDashoffset = String(circ * (1 - Math.min(1, ratio)));
      ringFill.classList.toggle('is-warning', ratio >= 0.8 && ratio <= 1);
      ringFill.classList.toggle('is-danger', ratio > 1);
      document.getElementById('budgetHeroPercent').textContent = `${Math.round(ratio * 100)}%`;
      document.getElementById('budgetHeroName').textContent = primary.category ? escapeHtml(primary.category) : 'ทุกหมวด (งบรวม)';
      document.getElementById('budgetHeroSpent').textContent = money(primary.spent);

      const remainEl = document.getElementById('budgetHeroRemain');
      remainEl.textContent = money(primary.remaining);
      remainEl.classList.toggle('is-negative', primary.remaining < 0);

      document.getElementById('budgetHeroBadge').classList.remove('hidden');
      document.getElementById('budgetHeroEditBtn').classList.remove('hidden');

      const daysLeftEl = document.getElementById('budgetHeroDaysLeft');
      const dailyAllowEl = document.getElementById('budgetHeroDailyAllowance');
      let dailyAllowText = '฿0';
      if (daysLeftEl && dailyAllowEl) {
        if (primary.periodEnd) {
          const end = parseDateVal(primary.periodEnd);
          const t = parseDateVal(today());
          const diffDays = Math.max(1, Math.round((end - t) / 86400000) + 1);
          daysLeftEl.textContent = `${diffDays} วัน`;
          const allow = Math.max(0, (primary.remaining || 0) / diffDays);
          dailyAllowText = money(allow);
          dailyAllowEl.textContent = dailyAllowText;
        } else {
          daysLeftEl.textContent = '—';
          dailyAllowEl.textContent = '฿0';
        }
      }

      const riskEl = document.getElementById('budgetHeroRisk');
      if (riskEl) {
        riskEl.classList.remove('hidden');
        if (primary.overBudget) {
          riskEl.className = 'budget-hero-risk';
          riskEl.innerHTML = `<i data-lucide="alert-triangle"></i><span>ใช้เงินเกินงบแล้ว ${money(Math.abs(primary.remaining))} (รอบสิ้นสุด ${dateDisplay(primary.periodEnd)})</span>`;
        } else if (ratio >= 0.8) {
          riskEl.className = 'budget-hero-risk';
          riskEl.innerHTML = `<i data-lucide="alert-circle"></i><span>ใกล้เต็มวงเงินแล้ว (${Math.round(ratio * 100)}%) เหลือใช้ได้อีก ${money(primary.remaining)}</span>`;
        } else {
          riskEl.className = 'budget-hero-risk is-ok';
          riskEl.innerHTML = `<i data-lucide="check-circle-2"></i><span>การใช้จ่ายอยู่ในเกณฑ์ปกติ (เฉลี่ยใช้วันละไม่เกิน ${dailyAllowText} จนถึงสิ้นรอบ)</span>`;
        }
      }
    } else {
      ringFill.style.strokeDashoffset = String(circ);
      ringFill.classList.remove('is-warning', 'is-danger');
      document.getElementById('budgetHeroPercent').textContent = '—';
      document.getElementById('budgetHeroName').textContent = 'ยังไม่ได้ตั้งงบหลัก';
      document.getElementById('budgetHeroSpent').textContent = '฿0';
      const remainEl = document.getElementById('budgetHeroRemain');
      remainEl.textContent = '฿0';
      remainEl.classList.remove('is-negative');
      document.getElementById('budgetHeroBadge').classList.add('hidden');
      document.getElementById('budgetHeroEditBtn').classList.add('hidden');
      const daysLeftEl = document.getElementById('budgetHeroDaysLeft');
      const dailyAllowEl = document.getElementById('budgetHeroDailyAllowance');
      if (daysLeftEl) daysLeftEl.textContent = '—';
      if (dailyAllowEl) dailyAllowEl.textContent = '฿0';
      const riskEl = document.getElementById('budgetHeroRisk');
      if (riskEl) {
        riskEl.className = 'budget-hero-risk hidden';
        riskEl.innerHTML = '';
      }
    }

    const totalAmt = budgets.reduce((s, b) => s + Number(b.amount || 0), 0);
    const overCount = budgets.filter((b) => b.overBudget).length;
    document.getElementById('budgetOverviewCount').textContent = `${budgets.length} งบ`;
    document.getElementById('budgetOverviewTotal').textContent = money(totalAmt);
    document.getElementById('budgetOverviewOverCount').textContent = `${overCount} งบ`;
    document.getElementById('budgetOverviewOverChip').classList.toggle('is-danger', overCount > 0);
    document.getElementById('budgetOverFilterToggle').classList.toggle('active', Boolean(App.budgetShowOverOnly));

    const visible = App.budgetShowOverOnly ? budgets.filter((b) => b.overBudget) : budgets;
    const list = document.getElementById('budgetList');
    if (!visible.length) {
      list.innerHTML = emptyHtml(App.budgetShowOverOnly ? 'ไม่มีงบประมาณที่เกินงบในขณะนี้' : 'ยังไม่มีงบประมาณ กดปุ่ม "ตั้งงบประมาณ" เพื่อเริ่มต้น');
    } else {
      list.innerHTML = visible.map((b) => {
        const isPrimary = (primary && primary.budgetId === b.budgetId);
        const percentVal = b.percent || Math.round((b.ratio || 0) * 100);
        const barWidth = Math.min(100, Math.round((b.ratio || 0) * 100));
        const statusClass = b.overBudget ? 'is-danger-pill' : b.ratio >= 0.8 ? 'is-warning-pill' : 'is-ok-pill';
        const barClass = b.overBudget ? 'danger' : b.ratio >= 0.8 ? 'warning' : '';

        return `
          <div class="envelope is-budget ${b.overBudget ? 'is-over-budget' : ''} ${isPrimary ? 'is-primary-budget' : ''}">
            <div class="envelope-top">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="status-pill ${statusClass}">${percentVal}%</span>
                ${isPrimary ? '<span class="status-pill is-primary-pill">⭐ งบหลัก</span>' : ''}
              </div>
              <div class="envelope-actions">
                <button class="icon-chip-sm" data-edit-budget="${b.budgetId}" type="button" title="แก้ไข"><i data-lucide="pencil"></i></button>
                <button class="icon-chip-sm danger" data-delete-budget="${b.budgetId}" type="button" title="ลบ"><i data-lucide="trash-2"></i></button>
              </div>
            </div>
            <p class="cat truncate" title="${b.category ? escapeHtml(b.category) : 'ทุกหมวด (งบรวม)'}">
              ${b.category ? escapeHtml(b.category) : 'ทุกหมวด (งบรวม)'}
            </p>
            <strong class="amt">${money(b.amount)}</strong>
            <div class="track"><i class="${barClass}" style="width:${barWidth}%"></i></div>
            <small>ใช้ไป ${money(b.spent)} · เหลือ ${money(b.remaining)} · ${App.periodLabel[b.period] || b.period}</small>
          </div>
        `;
      }).join('');
    }

    list.querySelectorAll('[data-edit-budget]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const b = budgets.find((x) => x.budgetId === btn.dataset.editBudget);
        if (b) openBudgetFormModal(b);
      });
    });
    list.querySelectorAll('[data-delete-budget]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.envelope');
        const id = btn.dataset.deleteBudget;
        startUndoDelete({
          message: 'ลบงบประมาณแล้ว',
          onHide: () => row?.classList.add('is-pending-delete'),
          onShow: () => row?.classList.remove('is-pending-delete'),
          onCommit: async () => {
            setLoading(true);
            try {
              App.data = await api('deleteBudget', App.token, id);
              renderAll();
            } finally { setLoading(false); }
          },
        });
      });
    });
    renderIcons();
  }

      </div>
    `).join('') : emptyHtml('ยังไม่มีเป้าหมายการออม');

    list.querySelectorAll('[data-edit-goal]').forEach((b) => b.addEventListener('click', () => openSavingsGoalFormModal(goals.find((g) => g.savingsGoalId === b.dataset.editGoal))));
    list.querySelectorAll('[data-dep-goal]').forEach((b) => b.addEventListener('click', () => openSavingsLogModal(goals.find((g) => g.savingsGoalId === b.dataset.depGoal), 'deposit')));
    list.querySelectorAll('[data-with-goal]').forEach((b) => b.addEventListener('click', () => openSavingsLogModal(goals.find((g) => g.savingsGoalId === b.dataset.withGoal), 'withdraw')));
    list.querySelectorAll('[data-delete-goal]').forEach((b) => {
      b.addEventListener('click', () => {
        const id = b.dataset.deleteGoal;
        startUndoDelete({
          message: 'ลบเป้าหมายแล้ว',
          onCommit: async () => {
            setLoading(true);
            try {
              App.data = await api('deleteSavingsGoal', App.token, id);
              renderAll();
            } finally { setLoading(false); }
          },
        });
      });
    });

    const goalMap = {};
    goals.forEach((g) => { goalMap[g.savingsGoalId] = g.name; });
    const logList = document.getElementById('savingsLogList');
    const logs = App.data.savingsLogs || [];
    logList.innerHTML = logs.length ? logs.map((l) => `
      <div class="transaction-row">
        <div class="flex items-center gap-3">
          <div class="transaction-icon ${l.direction === 'withdraw' ? 'expense' : 'income'}">
            <i data-lucide="${l.direction === 'withdraw' ? 'arrow-up-from-line' : 'arrow-down-to-line'}"></i>
          </div>
          <div>
            <p class="font-bold">${escapeHtml(goalMap[l.savingsGoalId] || 'เงินออม')}</p>
            <p class="text-xs text-slate-500">${dateDisplay(l.date)} ${l.note ? '· ' + escapeHtml(l.note) : ''}</p>
          </div>
        </div>
        <strong>${l.direction === 'withdraw' ? '-' : '+'}${money(l.amount)}</strong>
      </div>
    `).join('') : emptyHtml('ยังไม่มีประวัติการฝากถอน');

    renderIcons();
  }

  function renderAnalytics() {
    if (!App.data) return;
    syncChartTheme();
    const an = App.data.analytics || {};
    const daily = an.daily || { expenseChangePercent: 0, expense: 0, balance: 0, income: 0 };
    const weekly = an.weekly || { expenseChangePercent: 0, expense: 0, balance: 0, income: 0 };
    const monthly = an.monthly || { expenseChangePercent: 0, expense: 0, balance: 0, income: 0 };

    const renderCard = (id, title, s) => {
      const el = document.getElementById(id);
      if (!el) return;
      const chg = Number(s.expenseChangePercent || 0);
      const chgClass = chg > 0 ? 'up' : chg < 0 ? 'down' : '';
      const chgSign = chg > 0 ? '+' : '';
      el.innerHTML = `
        <span class="l">${title}</span>
        <span class="v ${chgClass}">${chgSign}${chg}%</span>
        <p class="cap">จ่าย ${money(s.expense)} · เหลือ ${money(s.balance)}</p>
      `;
    };
    renderCard('dailyCompare', 'วันนี้', daily);
    renderCard('weeklyCompare', 'สัปดาห์นี้', weekly);
    renderCard('monthlyCompare', 'เดือนนี้', monthly);

    // 1. หมวดหมู่ & สัดส่วนแต่ละหมวด (Category Breakdown & Doughnut Chart)
    const catList = document.getElementById('categoryBreakdownList');
    const categories = an.categoryExpense || [];
    const totalExp = categories.reduce((sum, item) => sum + Number(item.amount || 0), 0);

    if (catList) {
      if (!categories.length || totalExp <= 0) {
        catList.innerHTML = emptyHtml('ยังไม่มีรายจ่ายในเดือนนี้');
      } else {
        catList.innerHTML = categories.map((item, idx) => {
          const pct = totalExp > 0 ? Math.round((item.amount / totalExp) * 100) : 0;
          const color = categoryColorFor(item.category) || CATEGORY_COLORS[idx % CATEGORY_COLORS.length];
          return `
            <div class="cat-row">
              <span class="dot" style="background:${color}"></span>
              <span class="name" title="${escapeHtml(item.category)}">${escapeHtml(item.category)}</span>
              <span class="amt">${money(item.amount)}</span>
              <span class="pct">${pct}%</span>
            </div>
          `;
        }).join('');
      }
    }

    const pieCtx = document.getElementById('expensePie');
    if (pieCtx) {
      if (App.charts.pie) App.charts.pie.destroy();
      if (categories.length && totalExp > 0) {
        const pieColors = categories.map((i, idx) => categoryColorFor(i.category) || CATEGORY_COLORS[idx % CATEGORY_COLORS.length]);
        App.charts.pie = new Chart(pieCtx, {
          type: 'doughnut',
          data: {
            labels: categories.map((i) => i.category),
            datasets: [{
              data: categories.map((i) => i.amount),
              backgroundColor: pieColors,
              borderWidth: 2,
              borderColor: getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#ffffff',
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => ` ${ctx.label}: ${money(ctx.parsed)} (${Math.round((ctx.parsed / totalExp) * 100)}%)`,
                },
              },
            },
          },
        });
      } else {
        App.charts.pie = new Chart(pieCtx, {
          type: 'doughnut',
          data: {
            labels: ['ยังไม่มีข้อมูลรายจ่าย'],
            datasets: [{
              data: [1],
              backgroundColor: [getComputedStyle(document.documentElement).getPropertyValue('--line-soft').trim() || '#e8dfcd'],
              borderWidth: 0,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
              legend: { display: false },
              tooltip: { enabled: false },
            },
          },
        });
      }
    }

    // 2. แนวโน้มรายรับเทียบรายจ่าย (Income vs Expense Bar Chart)
    const barCtx = document.getElementById('periodBar');
    if (barCtx) {
      if (App.charts.bar) App.charts.bar.destroy();
      App.charts.bar = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: ['วันนี้', 'สัปดาห์นี้', 'เดือนนี้'],
          datasets: [
            { label: 'รายรับ', data: [daily.income, weekly.income, monthly.income], backgroundColor: '#3f6b52' },
            { label: 'รายจ่าย', data: [daily.expense, weekly.expense, monthly.expense], backgroundColor: '#a03f2c' },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top', align: 'end' },
            tooltip: {
              callbacks: {
                label: (ctx) => ` ${ctx.dataset.label}: ${money(ctx.parsed.y)}`,
              },
            },
          },
        },
      });
    }

    // 3. สถิติการใช้เงินเกินงบประมาณ (Overspending Statistics)
    const overList = document.getElementById('budgetOverspendList');
    if (overList) {
      const budgets = (an && an.budgetOverspend && an.budgetOverspend.length) ? an.budgetOverspend : (App.data.budgets || []);
      if (!budgets.length) {
        overList.innerHTML = emptyHtml('ยังไม่ได้ตั้งงบประมาณ สามารถไปตั้งงบประมาณได้ที่แท็บ "งบประมาณ"');
      } else {
        overList.innerHTML = budgets.map((b) => {
          const ov = b.overspend || { totalCycles: 0, overCount: 0, overProbabilityPercent: 0, totalOverAmount: 0, avgOverPercent: 0, avgSpent: 0 };
          const isOver = ov.overCount > 0 || b.overBudget;
          const periodName = App.periodLabel[b.period] || b.period;
          const catName = b.category ? escapeHtml(b.category) : 'ทุกหมวดหมู่ (งบรวม)';
          const statusPill = isOver
            ? `<span class="status-pill is-danger-pill">เกินงบ ${ov.overCount}/${ov.totalCycles || 1} รอบ</span>`
            : `<span class="status-pill is-ok-pill">อยู่ในงบ (${ov.totalCycles || 0} รอบ)</span>`;

          return `
            <div class="overspend-card">
              <div class="overspend-card-head">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="name">${catName}</span>
                  <span class="status-pill">${periodName} · วงเงิน ${money(b.amount)}</span>
                </div>
                ${statusPill}
              </div>
              <div class="overspend-grid">
                <div class="overspend-stat">
                  <span class="lbl">โอกาสเกินงบ</span>
                  <span class="val ${ov.overProbabilityPercent > 0 ? 'danger' : ''}">${ov.overProbabilityPercent}%</span>
                </div>
                <div class="overspend-stat">
                  <span class="lbl">ยอดเกินสะสม</span>
                  <span class="val ${ov.totalOverAmount > 0 ? 'danger' : ''}">${money(ov.totalOverAmount)}</span>
                </div>
                <div class="overspend-stat">
                  <span class="lbl">เกินเฉลี่ย / รอบ</span>
                  <span class="val ${ov.avgOverPercent > 0 ? 'danger' : ''}">${ov.avgOverPercent > 0 ? '+' + ov.avgOverPercent + '%' : '0%'}</span>
                </div>
                <div class="overspend-stat">
                  <span class="lbl">ใช้จ่ายเฉลี่ย</span>
                  <span class="val">${money(ov.avgSpent || b.spent)}</span>
                </div>
              </div>
              <p class="overspend-note">
                ${ov.totalCycles > 0 
                  ? `คำนวณจากประวัติการใช้จ่ายย้อนหลัง ${ov.totalCycles} รอบ (รอบละ ${periodName} วงเงิน ${money(b.amount)})`
                  : `รอบปัจจุบัน (${periodName}): ใช้ไปแล้ว ${money(b.spent)} จากงบ ${money(b.amount)} (${b.percent || 0}%)`}
              </p>
            </div>
          `;
        }).join('');
      }
    }
  }

  function syncChartTheme() {
    if (typeof Chart === 'undefined') return;
    const styles = getComputedStyle(document.documentElement);
    Chart.defaults.color = styles.getPropertyValue('--text-soft').trim() || '#7c7057';
    Chart.defaults.borderColor = styles.getPropertyValue('--line').trim() || '#ddceac';
  }

  function renderCategoryManager() {
    const list = document.getElementById('categoryManagerList');
    if (!list || !App.data.categories) return;
    const type = App.categoryManagerType;
    const items = App.data.categories[type] || [];
    list.innerHTML = items.map((c) => `
      <div class="category-row">
        <div class="swatch" style="background:${c.color}"><i data-lucide="${c.icon}"></i></div>
        <span class="name truncate">${escapeHtml(c.name)}</span>
        <div class="actions">
          <button class="icon-chip-sm" data-edit-cat="${c.categoryId}"><i data-lucide="pencil"></i></button>
          ${c.name !== 'อื่นๆ' ? `<button class="icon-chip-sm danger" data-del-cat="${c.categoryId}"><i data-lucide="trash-2"></i></button>` : ''}
        </div>
      </div>
    `).join('');

    list.querySelectorAll('[data-edit-cat]').forEach((b) => {
      b.addEventListener('click', () => openCategoryFormModal(items.find((x) => x.categoryId === b.dataset.editCat)));
    });
    list.querySelectorAll('[data-del-cat]').forEach((b) => {
      b.addEventListener('click', async () => {
        setLoading(true);
        try {
          App.data = await api('deleteCategory', App.token, b.dataset.delCat);
          renderAll();
        } catch (err) { showToast(err.message, true); }
        finally { setLoading(false); }
      });
    });
    renderIcons();
  }

  function openCategoryFormModal(cat) {
    document.getElementById('categoryEditingId').value = cat ? cat.categoryId : '';
    document.getElementById('categoryEditingType').value = cat ? cat.type : App.categoryManagerType;
    document.getElementById('categoryName').value = cat ? cat.name : '';
    document.getElementById('categoryIcon').value = cat ? cat.icon : 'tag';
    document.getElementById('categoryColor').value = cat ? cat.color : CATEGORY_COLORS[0];
    document.getElementById('categoryIconPicker').innerHTML = CATEGORY_ICONS.map((ic) => `
      <button type="button" data-cic="${ic}" class="${ic === (cat?.icon || 'tag') ? 'active' : ''}"><i data-lucide="${ic}"></i></button>
    `).join('');
    document.querySelectorAll('[data-cic]').forEach((b) => b.addEventListener('click', () => {
      document.getElementById('categoryIcon').value = b.dataset.cic;
      document.querySelectorAll('[data-cic]').forEach((i) => i.classList.toggle('active', i === b));
    }));
    document.getElementById('categoryColorPicker').innerHTML = CATEGORY_COLORS.map((col) => `
      <button type="button" data-ccol="${col}" class="${col === (cat?.color || CATEGORY_COLORS[0]) ? 'active' : ''}" style="background:${col}"></button>
    `).join('');
    document.querySelectorAll('[data-ccol]').forEach((b) => b.addEventListener('click', () => {
      document.getElementById('categoryColor').value = b.dataset.ccol;
      document.querySelectorAll('[data-ccol]').forEach((i) => i.classList.toggle('active', i === b));
    }));
    document.getElementById('categoryFormModal').classList.remove('hidden');
    trackModalOpen('categoryFormModal');
    renderIcons();
  }

  async function submitCategory(e) {
    e.preventDefault();
    const payload = {
      categoryId: document.getElementById('categoryEditingId').value,
      type: document.getElementById('categoryEditingType').value,
      name: document.getElementById('categoryName').value,
      icon: document.getElementById('categoryIcon').value,
      color: document.getElementById('categoryColor').value,
    };
    setLoading(true);
    try {
      App.data = await api('saveCategory', App.token, payload);
      document.getElementById('categoryFormModal').classList.add('hidden');
      trackModalClose();
      renderAll();
      showToast('บันทึกหมวดหมู่แล้ว');
    } finally { setLoading(false); }
  }

  function downloadCsv_(filename, rows) {
    const csv = rows.map((r) => r.map((c) => `"${String(c || '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }

  function exportTransactionsCsv() {
    const rows = [['วันที่', 'ประเภท', 'หมวดหมู่', 'จำนวนเงิน', 'โน้ต']];
    (App.data.transactions || []).forEach((t) => rows.push([t.date, t.type === 'income' ? 'รายรับ' : 'รายจ่าย', t.category, t.amount, t.note || '']));
    downloadCsv_(`finnote-tx-${today()}.csv`, rows);
  }

  function exportSavingsCsv() {
    const rows = [['วันที่', 'ประเภท', 'จำนวนเงิน', 'โน้ต']];
    (App.data.savingsLogs || []).forEach((l) => rows.push([l.date, l.direction, l.amount, l.note || '']));
    downloadCsv_(`finnote-savings-${today()}.csv`, rows);
  }

  function hydrateSettings() {
    const s = App.data.settings || {};
    document.getElementById('emailNotifications').checked = Boolean(s.emailNotifications);
    document.getElementById('reminderTime').value = s.reminderTime || '20:00';
    document.getElementById('budgetAlertThreshold').value = String(s.budgetAlertThreshold || 0.8);
  }

  async function submitSettings(e) {
    e.preventDefault();
    const payload = {
      emailNotifications: document.getElementById('emailNotifications').checked,
      reminderTime: document.getElementById('reminderTime').value,
      budgetAlertThreshold: Number(document.getElementById('budgetAlertThreshold').value),
    };
    setLoading(true);
    try {
      App.data = await api('updateSettings', App.token, payload);
      renderAll();
      showToast('บันทึกการตั้งค่าแล้ว');
    } finally { setLoading(false); }
  }

  function readProfileImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 750000) return showToast('รูปใหญ่เกินไป (ไม่เกิน 750KB)', true);
    const r = new FileReader();
    r.onload = () => {
      App.profileImageDraft = r.result;
      document.getElementById('settingsAvatar').src = r.result;
    };
    r.readAsDataURL(file);
  }

  async function submitProfile(e) {
    e.preventDefault();
    const payload = { displayName: document.getElementById('settingsDisplayName').value };
    if (App.profileImageDraft) payload.profileImage = App.profileImageDraft;
    setLoading(true);
    try {
      App.data = await api('updateProfile', App.token, payload);
      App.profileImageDraft = '';
      renderAll();
      showToast('บันทึกโปรไฟล์แล้ว');
    } finally { setLoading(false); }
  }

  async function submitDeleteAccount(e) {
    e.preventDefault();
    const password = document.getElementById('deleteAccountPassword').value;
    if (!confirm('ยืนยันลบบัญชีและข้อมูลทั้งหมดถาวร?')) return;
    setLoading(true);
    try {
      await api('deleteAccount', App.token, { password });
      sessionStorage.clear();
      localStorage.clear();
      showAuth();
      showToast('ลบบัญชีเรียบร้อยแล้ว');
    } finally { setLoading(false); }
  }

  function setTodayLabel() {
    document.getElementById('todayLabel').textContent = new Intl.DateTimeFormat('th-TH', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
    }).format(new Date());
  }

  function setLoading(isLoading) {
    document.getElementById('loadingOverlay').classList.toggle('hidden', !isLoading);
  }

  let activeUndo_ = null;
  function startUndoDelete({ message, onHide, onShow, onCommit, duration = 5000 }) {
    if (activeUndo_) { clearTimeout(activeUndo_.timer); activeUndo_.commit(); }
    onHide?.();
    const toast = document.getElementById('undoToast');
    document.getElementById('undoToastMessage').textContent = message;
    toast.classList.remove('hidden');
    const commit = () => { toast.classList.add('hidden'); activeUndo_ = null; onCommit(); };
    const timer = setTimeout(commit, duration);
    activeUndo_ = {
      timer, commit,
      cancel: () => { clearTimeout(timer); toast.classList.add('hidden'); activeUndo_ = null; onShow?.(); },
    };
  }

  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.toggle('error', Boolean(isError));
    toast.classList.remove('hidden');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.add('hidden'), 3200);
  }

  function renderIcons() {
    if (window.lucide) lucide.createIcons();
  }

  function money(val) {
    return Number(val || 0).toLocaleString('th-TH', { style: 'currency', currency: 'THB', minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  function today() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function currentTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function dateDisplay(v) {
    if (!v) return '';
    const p = String(v).split('-').map(Number);
    return new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(p[0], p[1] - 1, p[2]));
  }

  function timeDisplay(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? '' : new Intl.DateTimeFormat('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
  }

  function avatarDataUrl(name) {
    const initials = String(name || 'M').trim().slice(0, 2).toUpperCase();
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="18" fill="#3f6b52"/>
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="white">${escapeHtml(initials)}</text>
      </svg>
    `);
  }

  function emptyHtml(txt) {
    return `<div class="empty-state">${escapeHtml(txt)}</div>`;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
  }

  window.openBudgetFormModal = openBudgetFormModal;
  window.closeBudgetFormModal = closeBudgetFormModal;
  window.parseDate = parseDateVal;
</script>
