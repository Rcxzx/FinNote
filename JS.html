    if (!category) return 'layout-grid';
    const match = (App.data && App.data.categories && App.data.categories.expense || []).find((item) => item.name === category);

  function categoryColorFor(category) {
    if (!category) return '';
    const match = (App.data && App.data.categories && App.data.categories.expense || []).find((item) => item.name === category);

  // (id เดิม = สีเดิมเสมอ ไม่กระพริบเปลี่ยนสีตอน re-render)
  function colorForSeed(seed) {
    const str = String(seed || '');
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return CATEGORY_COLORS[hash % CATEGORY_COLORS.length];
  }

  function callApi_(name, ...args) {
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('ต้องเปิดผ่าน Google Apps Script Web App'));
        return;
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[name](...args);
    });
  }

  function isSessionExpiredError_(error) {
    return Boolean(error) && String(error.message || '').indexOf('เซสชันหมดอายุ') !== -1;
  }

  const AUTH_ENTRY_CALLS = ['resumeSession', 'loginUser', 'registerUser', 'verifyEmailPin', 'requestPasswordReset', 'resetPasswordWithPin'];

  let sessionResumePromise_ = null;

  function resumeSessionOnce_() {
    if (!sessionResumePromise_) {
      sessionResumePromise_ = callApi_('resumeSession', App.rememberToken)
        .then((result) => {
          applySessionResult(result);
          return result;
        })
        .finally(() => {
          sessionResumePromise_ = null;
        });
    }
    return sessionResumePromise_;
  }

  async function api(name, ...args) {
    try {
      return await callApi_(name, ...args);
    } catch (error) {
      const canRecover = !AUTH_ENTRY_CALLS.includes(name) && isSessionExpiredError_(error) && App.rememberToken;
      if (!canRecover) throw error;

      const staleToken = args[0];
      try {
        await resumeSessionOnce_();
      } catch (resumeError) {
        localStorage.removeItem('moneyflow_remember');
        App.rememberToken = '';
        App.token = '';
        sessionStorage.removeItem('moneyflow_session');
        showAuth();
        throw error;
      }

      const retryArgs = args.map((arg) => (arg === staleToken ? App.token : arg));
      return callApi_(name, ...retryArgs);
    }
  }

  async function loadAppData() {
    setLoading(true);
    try {
      App.data = await api('getAppData', App.token);
      showApp();
      renderAll();
    } catch (error) {
      sessionStorage.removeItem('moneyflow_session');
      App.token = '';
      if (App.rememberToken) {
        setLoading(false);
        await resumeSession();
        return;
      }
      showAuth();
      showToast(error.message || 'เซสชันหมดอายุ', true);
    } finally {
      setLoading(false);
    }
  }

  async function resumeSession() {
    setLoading(true);
    try {
      await resumeSessionOnce_();
    } catch (error) {
      localStorage.removeItem('moneyflow_remember');
      App.rememberToken = '';
      showAuth();
    } finally {
      setLoading(false);
    }
  }

  function applySessionResult(result) {
    App.token = result.token;
    App.data = result.data;
    sessionStorage.setItem('moneyflow_session', App.token);
    if (result.rememberToken) {
      App.rememberToken = result.rememberToken;
      localStorage.setItem('moneyflow_remember', App.rememberToken);
    }
    showApp();
    renderAll();
  }

  let silentRefreshBusy_ = false;

  async function silentRefresh() {
    if (!App.token || !App.data || silentRefreshBusy_) return;
    silentRefreshBusy_ = true;
    try {
      App.data = await api('getAppData', App.token);
      renderAll();
    } catch (error) {
      console.warn(error);
    } finally {
      silentRefreshBusy_ = false;
    }
  }

  function showAuth() {
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('appShell').classList.add('hidden');
    renderIcons();
  }

  function showApp() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appShell').classList.remove('hidden');
  }

  function setAuthMode(mode) {
    App.authMode = mode;
    App.forgotStep = 'email';
    App.pendingEmailVerification = false;
    refreshAuthFormUI();
    const firstField = mode === 'forgot' ? '#email' : (mode === 'register' ? '#displayName' : '#email');
    const el = document.querySelector(firstField);
    if (el) el.focus();
  }

  function refreshAuthFormUI() {
    const mode = App.authMode;
    const isRegister = mode === 'register';
    const isForgot = mode === 'forgot';
    const isForgotReset = isForgot && App.forgotStep === 'reset';

    document.getElementById('displayNameWrap').classList.toggle('hidden', !isRegister);
    document.getElementById('passwordWrap').classList.toggle('hidden', isForgot);
    document.getElementById('pinWrap').classList.toggle('hidden', !(isRegister && App.pendingEmailVerification));
    document.getElementById('emailPin').value = '';
    document.getElementById('forgotPinWrap').classList.toggle('hidden', !isForgotReset);
    document.getElementById('forgotNewPasswordWrap').classList.toggle('hidden', !isForgotReset);
    document.getElementById('authModeToggle').classList.toggle('hidden', isForgot);
    document.getElementById('backToLoginBtn').classList.toggle('hidden', !isForgot);

    let submitLabel = '<i data-lucide="log-in"></i><span>เข้าสู่ระบบ</span>';
    if (isRegister) submitLabel = '<i data-lucide="user-plus"></i><span>สมัครสมาชิก</span>';
    if (isForgot) {
      submitLabel = isForgotReset
        ? '<i data-lucide="key-round"></i><span>ตั้งรหัสผ่านใหม่</span>'
        : '<i data-lucide="mail"></i><span>ส่ง PIN ไปทางอีเมล</span>';
    }
    document.getElementById('authSubmit').innerHTML = submitLabel;

    document.getElementById('authModeToggle').innerHTML = isRegister
      ? '<i data-lucide="log-in"></i><span>เข้าสู่ระบบ</span>'
      : '<i data-lucide="user-plus"></i><span>สมัคร</span>';
    renderIcons();
  }

  function toggleAuthMode() {
    setAuthMode(App.authMode === 'login' ? 'register' : 'login');
  }

  async function submitAuth(event) {
    event.preventDefault();
    if (App.authMode === 'forgot') {
      await submitForgotPassword();
      return;
    }
    if (App.authMode === 'register' && App.pendingEmailVerification && !document.getElementById('emailPin').value.trim()) {
      showToast('กรุณากรอก PIN ที่ได้รับทางอีเมล', true);
      document.getElementById('emailPin').focus();
      return;
    }
    const payload = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      displayName: document.getElementById('displayName').value,
      pin: App.pendingEmailVerification ? document.getElementById('emailPin').value : '',
    };
    setLoading(true);
    try {
      const result = await api(App.authMode === 'register' ? 'registerUser' : 'loginUser', payload);
      if (result.requiresPin) {
        App.pendingEmailVerification = true;
        document.getElementById('pinWrap').classList.remove('hidden');
        document.getElementById('authSubmit').innerHTML = '<i data-lucide="shield-check"></i><span>ยืนยัน PIN</span>';
        document.getElementById('emailPin').focus();
        showToast(result.message || 'ส่ง PIN ไปยังอีเมลแล้ว');
        renderIcons();
        return;
      }
      App.pendingEmailVerification = false;
      applySessionResult(result);
    } catch (error) {
      showToast(error.message || 'ไม่สามารถเข้าสู่ระบบได้', true);
    } finally {
      setLoading(false);
    }
  }

  async function submitForgotPassword() {
    const email = document.getElementById('email').value.trim();
    if (!email) {
      showToast('กรุณากรอกอีเมล', true);
      document.getElementById('email').focus();
      return;
    }
    setLoading(true);
    try {
      if (App.forgotStep === 'email') {
        const result = await api('requestPasswordReset', email);
        showToast(result.message || 'ส่ง PIN ไปยังอีเมลแล้ว');
        App.forgotStep = 'reset';
        refreshAuthFormUI();
        document.getElementById('forgotPin').focus();
      } else {
        const pin = document.getElementById('forgotPin').value.trim();
        const newPassword = document.getElementById('forgotNewPassword').value;
        if (!pin || !newPassword) {
          showToast('กรุณากรอก PIN และรหัสผ่านใหม่ให้ครบ', true);
          return;
        }
        const result = await api('resetPasswordWithPin', { email, pin, newPassword });
        showToast('ตั้งรหัสผ่านใหม่เรียบร้อย เข้าสู่ระบบให้อัตโนมัติ');
        setAuthMode('login');
        applySessionResult(result);
      }
    } catch (error) {
      showToast(error.message || 'ดำเนินการไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  async function logout() {
    setLoading(true);
    try {
      if (App.token) await api('logoutUser', App.token);
    } catch (error) {
      console.warn(error);
    } finally {
      sessionStorage.removeItem('moneyflow_session');
      localStorage.removeItem('moneyflow_remember');
      App.token = '';
      App.rememberToken = '';
      App.data = null;
      setLoading(false);
      showAuth();
    }
  }

  function renderAll() {
    if (!App.data) return;
    syncCategoriesFromData();
    renderProfile();
    renderDashboard();
    renderTransactions();
    renderBudgets();
    renderSavings();
    renderRecurring();
    renderAnalytics();
    hydrateSettings();
    renderCategoryManager();
    renderIcons();

  function applyTheme(isDark) {
    document.documentElement.classList.toggle('dark', Boolean(isDark));

    syncChartTheme();

  function watchSystemTheme() {
    if (!window.matchMedia) return;
    var query = window.matchMedia('(prefers-color-scheme: dark)');
    var handler = function (e) {
      var stored;
      try { stored = localStorage.getItem('moneyflow-theme'); } catch (err) { stored = null; }
      if (stored !== 'dark' && stored !== 'light') applyTheme(e.matches);
    };
    if (query.addEventListener) query.addEventListener('change', handler);
    else if (query.addListener) query.addListener(handler);
  }

      setTimeout(() => {

  function trackModalClose() {
    App.modalOpenCount = Math.max(0, App.modalOpenCount - 1);
    if (App.modalOpenCount === 0) {
      document.body.classList.remove('modal-open');
      if (App.lastFocusedEl && typeof App.lastFocusedEl.focus === 'function') {

  async function submitTransaction(event, prefix) {
    event.preventDefault();
    const payload = {
      type: document.getElementById(prefix + 'Type').value,
      amount: Number(document.getElementById(prefix + 'Amount').value),
      category: document.getElementById(prefix + 'Category').value,
      note: document.getElementById(prefix + 'Note').value,
      date: document.getElementById(prefix + 'Date').value,
      time: document.getElementById(prefix + 'Time').value,
    };
    setLoading(true);
    try {
      const wasEditing = Boolean(App.editingTransactionId);
      App.data = wasEditing
        ? await api('updateTransaction', App.token, App.editingTransactionId, payload)
        : await api('saveTransaction', App.token, payload);
      document.getElementById(prefix + 'Amount').value = '';
      document.getElementById(prefix + 'Note').value = '';
      document.getElementById(prefix + 'Date').value = today();
      document.getElementById(prefix + 'Time').value = currentTime();
      closeTransactionModal();
      renderAll();
      showToast(wasEditing ? 'แก้ไขรายการแล้ว' : 'บันทึกรายการแล้ว');
    } catch (error) {
      showToast(error.message || 'บันทึกรายการไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  function parseNlpAmountToken(token) {
    const cleaned = String(token || '')
      .replace(/[฿,]/g, '')
      .replace(/บาท$/i, '')
      .trim();
    if (!/^\d+(?:\.\d+)?$/.test(cleaned)) return null;
    const amount = Number(cleaned);
    return amount > 0 ? amount : null;
  }

  function cleanNlpCategory(tokens) {
    return tokens.join(' ')
      .replace(/^(ซื้อ|จ่าย|ค่า|รับ|ได้เงิน)\s+/i, '')
      .trim() || 'อื่นๆ';
  }

  // หมวดหมู่ที่เคยเพิ่มไว้ในเครื่องก่อนหน้านี้ (ตอนที่ระบบยังเก็บแค่ใน localStorage)
  // ยังโหลดมาต่อชั่วคราวเพื่อไม่ให้หายไปจาก dropdown — พอผู้ใช้บันทึกรายการด้วยหมวดนี้อีกครั้ง
  // เซิร์ฟเวอร์จะสร้างให้ถาวรอัตโนมัติ (ดู ensureCategoryExists_ ฝั่ง Code.js)
  function loadCustomCategories() {
    try {
      const stored = JSON.parse(localStorage.getItem('moneyflow_custom_categories') || '{}');
      ['expense', 'income'].forEach((type) => {
        (stored[type] || []).forEach((name) => {
          if (name && !App.categories[type].includes(name)) App.categories[type].push(name);
        });
      });
    } catch (error) {
      // เก็บข้อมูลใน localStorage เสียหาย ข้ามการโหลดไปเฉยๆ
    }
  }

  // เพิ่มหมวดหมู่ใหม่ชั่วคราวฝั่งหน้าจอ (สำหรับ dropdown ปัจจุบัน) — จะถูกบันทึกถาวรที่เซิร์ฟเวอร์
  // อัตโนมัติทันทีที่รายการ/งบ/รายการประจำที่ใช้หมวดนี้ถูกบันทึกจริง
  function addCustomCategory(type, name) {
    const clean = String(name || '').trim();
    if (!clean) return;
    if (!App.categories[type].includes(clean)) App.categories[type].push(clean);
  }

  function learnedCategoryKey(type, itemName) {
    return `${type}:${String(itemName || '').trim().toLowerCase()}`;
  }

  function getLearnedCategories() {
    try {
      return JSON.parse(localStorage.getItem('moneyflow_learned_categories') || '{}');
    } catch (error) {
      return {};
    }
  }

  function getLearnedCategory(type, itemName) {
    return getLearnedCategories()[learnedCategoryKey(type, itemName)] || null;
  }

  function saveLearnedCategory(type, itemName, category) {
    if (!itemName) return;
    const learned = getLearnedCategories();
    learned[learnedCategoryKey(type, itemName)] = category;
    localStorage.setItem('moneyflow_learned_categories', JSON.stringify(learned));
  }

  function detectNlpCategory(type, itemName) {
    const learned = getLearnedCategory(type, itemName);
    if (learned) return learned;
    const dictionary = NLP_CATEGORY_KEYWORDS[type] || {};
    const lowerName = String(itemName || '').toLowerCase();
    const matched = Object.keys(dictionary).find((categoryName) =>
      dictionary[categoryName].some((keyword) => lowerName.includes(keyword.toLowerCase())));
    return matched || 'อื่นๆ';
  }

  function parseNlpCommands(text) {
    const raw = String(text || '').trim().replace(/[,;|]+/g, ' ').replace(/\s+/g, ' ');
    const tokens = raw.split(' ').filter(Boolean);
    const items = [];
    let nameTokens = [];

    tokens.forEach((token) => {
      const amount = parseNlpAmountToken(token);
      if (amount) {
        const itemName = cleanNlpCategory(nameTokens);
        const type = document.getElementById('nlpType').value;
        items.push({
          type,
          amount,
          itemName,
          category: detectNlpCategory(type, itemName),
          note: itemName,
          date: today(),
          source: 'nlp',
        });
        nameTokens = [];
      } else {
        nameTokens.push(token);
      }
    });

    if (!items.length) throw new Error('กรุณาพิมพ์เป็น ชื่อรายการ เว้นวรรค ราคา เช่น ข้าวขาหมู 50 น้ำ 10');
    if (nameTokens.length) {
      const trailing = nameTokens.join(' ');
      items[items.length - 1].note = `${items[items.length - 1].note} | ข้อความที่ยังไม่มีราคา: ${trailing}`;
    }
    return items;
  }

  function renderNlpPreview() {
    const preview = document.getElementById('nlpPreview');
    const text = document.getElementById('nlpInput').value;
    if (!text.trim()) {
      preview.textContent = 'ระบบจะแยกชื่อรายการและจำนวนเงินให้อัตโนมัติ';
      return;
    }
    try {
      const parsed = parseNlpCommands(text);
      const sample = parsed.slice(0, 3).map((item) => `${item.category} ${money(item.amount)}`).join(' · ');
      preview.textContent = `อ่านได้ ${parsed.length} รายการ: ${sample}${parsed.length > 3 ? ' ...' : ''}`;
    } catch (error) {
      preview.textContent = error.message;
    }
  }

  function renderNlpConfirmList(items) {
    const list = document.getElementById('nlpConfirmList');
    list.innerHTML = items.map((item, index) => {
      const categories = App.categories[item.type].slice();
      if (!categories.includes(item.category)) categories.push(item.category);
      const options = categories.map((name) =>
        `<option value="${escapeHtml(name)}"${name === item.category ? ' selected' : ''}>${escapeHtml(name)}</option>`
      ).join('');
      return `
        <div class="nlp-confirm-item" data-index="${index}">
          <div class="nlp-confirm-item-head">
            <strong>${escapeHtml(item.itemName || item.note)}</strong>
            <span>${money(item.amount)}</span>
          </div>
          <p class="nlp-confirm-item-hint">ระบบจัดเข้าหมวดหมู่ "${escapeHtml(item.category)}" ถูกต้องไหม?</p>
          <select class="form-input nlp-confirm-category" data-index="${index}">
            ${options}
            <option value="__new__">+ สร้างหมวดหมู่ใหม่</option>
          </select>
          <input type="text" class="form-input nlp-confirm-new-category hidden" data-index="${index}" placeholder="พิมพ์ชื่อหมวดหมู่ใหม่">
        </div>
      `;
    }).join('');

    list.querySelectorAll('.nlp-confirm-category').forEach((select) => {
      select.addEventListener('change', () => {
        const index = select.dataset.index;
        const newInput = list.querySelector(`.nlp-confirm-new-category[data-index="${index}"]`);
        newInput.classList.toggle('hidden', select.value !== '__new__');
        if (select.value === '__new__') newInput.focus();
      });
    });
  }

  function confirmNlpSave() {
    const items = App.nlpPendingItems;
    if (!items || !items.length) {
      closeNlpConfirmModal();
      return;
    }

    const list = document.getElementById('nlpConfirmList');
    for (let index = 0; index < items.length; index += 1) {
      const select = list.querySelector(`.nlp-confirm-category[data-index="${index}"]`);
      const newInput = list.querySelector(`.nlp-confirm-new-category[data-index="${index}"]`);
      let category = select.value;

      if (category === '__new__') {
        category = newInput.value.trim();
        if (!category) {
          showToast('กรุณาตั้งชื่อหมวดหมู่ใหม่ให้ครบทุกรายการ', true);
          newInput.focus();
          return;
        }
        addCustomCategory(items[index].type, category);
      }

      if (category !== items[index].category) {
        saveLearnedCategory(items[index].type, items[index].itemName, category);
      }
      items[index].category = category;
      delete items[index].itemName;
    }

    saveNlpItems(items);
  }

  async function saveNlpItems(payloads) {
    setLoading(true);
    try {
      App.data = payloads.length === 1
        ? await api('saveTransaction', App.token, payloads[0])
        : await api('saveTransactions', App.token, payloads);
      closeNlpConfirmModal();
      renderAll();
      showToast(`บันทึกรายการแล้ว ${payloads.length} รายการ`);
    } catch (error) {
      showToast(error.message || 'บันทึกจากข้อความไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  function startNlpVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      showToast('เบราว์เซอร์นี้ยังไม่รองรับการพูดเพื่อจด', true);
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'th-TH';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (event) => {
      document.getElementById('nlpInput').value = event.results[0][0].transcript;
      renderNlpPreview();
    };
    recognition.onerror = () => showToast('ไม่สามารถรับเสียงได้', true);
    recognition.start();
  }

  function openOcrModal() {
    App.ocrItems = [];
    document.getElementById('ocrFileInput').value = '';
    document.getElementById('ocrStatus').textContent = 'รองรับหลายรูป ระบบจะอ่านยอดเงิน วันที่ และเวลาให้ตรวจทานก่อนบันทึก';
    renderOcrReviewList();
    document.getElementById('ocrModal').classList.remove('hidden');
    trackModalOpen('ocrModal', '#ocrModalClose');
    renderIcons();
  }

  function closeOcrModal() {
    const modal = document.getElementById('ocrModal');
    if (!modal || modal.classList.contains('hidden')) return;
    modal.classList.add('hidden');
    trackModalClose();
  }

  function handleOcrDragOver(event) {
    event.preventDefault();
    document.getElementById('ocrDropZone').classList.add('dragover');
  }

  function handleOcrDragLeave() {
    document.getElementById('ocrDropZone').classList.remove('dragover');
  }

  function handleOcrDrop(event) {
    event.preventDefault();
    document.getElementById('ocrDropZone').classList.remove('dragover');
    handleOcrFiles(event.dataTransfer.files);
  }

  async function handleOcrFiles(fileList) {
    const files = Array.from(fileList || []).filter((file) => file.type.startsWith('image/'));
    if (!files.length) return;
    if (!window.Tesseract) {
      showToast('OCR library ยังโหลดไม่สำเร็จ กรุณาลองใหม่', true);
      return;
    }

    document.getElementById('ocrStatus').textContent = `กำลังอ่าน ${files.length} รูป...`;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      document.getElementById('ocrStatus').textContent = `กำลังอ่าน ${i + 1}/${files.length}: ${file.name}`;
      try {
        const result = await Tesseract.recognize(file, 'tha+eng');
        App.ocrItems.push(parseOcrData(result.data || {}, file.name));
      } catch (error) {
        App.ocrItems.push({
          type: 'expense',
          category: file.name.replace(/\.[^.]+$/, ''),
          amount: 0,
          date: today(),
          time: '',
          note: `OCR อ่านไม่สำเร็จ: ${file.name}`,
          source: 'ocr',
        });
      }
      renderOcrReviewList();
    }
    document.getElementById('ocrStatus').textContent = `อ่านเสร็จแล้ว ${files.length} รูป กรุณาตรวจทานก่อนบันทึก`;
  }

  function parseOcrData(data, fileName) {
    return parseOcrText(data.text || '', fileName, data.words || []);
  }

  function parseOcrText(text, fileName, words) {
    const normalized = String(text || '').replace(/\r/g, '\n');
    const amount = extractOcrAmount(normalized, words || []);
    const date = extractOcrDate(normalized) || today();
    const time = extractOcrTime(normalized);
    const merchant = extractOcrTitle(normalized) || fileName.replace(/\.[^.]+$/, '') || 'สลิป';
    return {
      type: 'expense',
      category: merchant.slice(0, 80),
      amount,
      date,
      time,
      note: `OCR: ${fileName}${time ? ' เวลา ' + time : ''}`,
      source: 'ocr',
    };
  }

  function extractOcrAmount(text, words) {
    const lines = text.split('\n').map((line) => line.trim()).filter(Boolean);
    const moneyPattern = /(฿|THB|บาท)?\s*(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s*(บาท|THB)?/gi;
    const candidates = [];

    lines.forEach((line) => {
      const lower = line.toLowerCase();
      const hasKeyword = /(ยอด|จำนวน|จำนวนเงิน|รวม|โอน|ชำระ|เงิน|total|amount|paid|payment)/i.test(lower);
      const hasBaht = /(฿|บาท|thb)/i.test(lower);
      let match;
      moneyPattern.lastIndex = 0;
      while ((match = moneyPattern.exec(line))) {
        const value = Number(match[2].replace(/,/g, ''));
        if (value > 0 && value < 10000000 && !numberLooksLikeDateOrTime(line, match.index, match[0].length)) {
          let score = 1;
          if (hasKeyword) score += 7;
          if (hasBaht || match[1] || match[3]) score += 5;
          if (/\.\d{2}\b/.test(match[2])) score += 1;
          candidates.push({ value, score, text: match[2] });
        }
      }
    });

    extractVisualAmountCandidates(words || []).forEach((candidate) => candidates.push(candidate));
    if (!candidates.length) return 0;
    candidates.sort((a, b) => (b.score - a.score) || (b.value - a.value));
    return candidates[0].value;
  }

  function extractVisualAmountCandidates(words) {
    const normalizedWords = (words || []).map((word) => {
      const bbox = word.bbox || {};
      const height = Math.max(0, Number(bbox.y1 || 0) - Number(bbox.y0 || 0));
      return {
        text: String(word.text || '').trim(),
        bbox,
        height,
        y: Number(bbox.y0 || 0),
      };
    }).filter((word) => word.text);
    const heights = normalizedWords.map((word) => word.height).filter(Boolean).sort((a, b) => a - b);
    const medianHeight = heights.length ? heights[Math.floor(heights.length / 2)] : 0;
    const candidates = [];

    normalizedWords.forEach((word, index) => {
      const amount = parseOcrMoneyValue(word.text);
      if (!amount || amount >= 10000000) return;
      const nearby = normalizedWords
        .filter((other) => Math.abs(other.y - word.y) <= Math.max(10, word.height * 0.9))
        .map((other) => other.text)
        .join(' ');
      if (numberLooksLikeDateOrTime(nearby, nearby.indexOf(word.text), word.text.length)) return;
      let score = 1;
      if (/(ยอด|จำนวน|จำนวนเงิน|รวม|โอน|ชำระ|เงิน|total|amount|paid|payment)/i.test(nearby)) score += 7;
      if (/(฿|บาท|thb)/i.test(nearby)) score += 5;
      if (medianHeight && word.height >= medianHeight * 1.35) score += 5;
      else if (medianHeight && word.height >= medianHeight * 1.15) score += 2;
      if (/\.\d{2}\b/.test(word.text)) score += 1;
      candidates.push({ value: amount, score, text: word.text, index });
    });

    return candidates;
  }

  function parseOcrMoneyValue(text) {
    const match = String(text || '').match(/(?:฿|THB|บาท)?\s*(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s*(?:บาท|THB)?/i);
    if (!match) return 0;
    const value = Number(match[1].replace(/,/g, ''));
    return value > 0 ? value : 0;
  }

  function numberLooksLikeDateOrTime(line, start, length) {
    const safeStart = Math.max(0, start);
    const safeEnd = Math.max(safeStart, safeStart + length);
    const before = line.slice(Math.max(0, safeStart - 2), safeStart);
    const after = line.slice(safeEnd, Math.min(line.length, safeEnd + 2));
    return /[\/:\-]$/.test(before) || /^[\/:\-]/.test(after);
  }

  function extractOcrDate(text) {
    const normalized = text.replace(/\s+/g, ' ');
    const iso = normalized.match(/\b(20\d{2}|25\d{2})[-\/](\d{1,2})[-\/](\d{1,2})\b/);
    if (iso) return formatDateParts(normalizeOcrYear(Number(iso[1])), Number(iso[2]), Number(iso[3]));
    const dmy = normalized.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](20\d{2}|25\d{2}|\d{2})\b/);
    if (dmy) {
      const year = normalizeOcrYear(Number(dmy[3]) < 100 ? 2000 + Number(dmy[3]) : Number(dmy[3]));
      return formatDateParts(year, Number(dmy[2]), Number(dmy[1]));
    }
    const monthDate = normalized.match(/\b(\d{1,2})\s*(ม\.?ค\.?|มกราคม|ก\.?พ\.?|กุมภาพันธ์|มี\.?ค\.?|มีนาคม|เม\.?ย\.?|เมษายน|พ\.?ค\.?|พฤษภาคม|มิ\.?ย\.?|มิถุนายน|ก\.?ค\.?|กรกฎาคม|ส\.?ค\.?|สิงหาคม|ก\.?ย\.?|กันยายน|ต\.?ค\.?|ตุลาคม|พ\.?ย\.?|พฤศจิกายน|ธ\.?ค\.?|ธันวาคม|jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s*(20\d{2}|25\d{2}|\d{2})\b/i);
    if (monthDate) {
      const year = normalizeOcrYear(Number(monthDate[3]) < 100 ? 2000 + Number(monthDate[3]) : Number(monthDate[3]));
      return formatDateParts(year, ocrMonthNumber(monthDate[2]), Number(monthDate[1]));
    }
    return '';
  }

  function extractOcrTime(text) {
    const match = text.match(/(?:^|\D)([01]?\d|2[0-3])[:.](\d{2})(?:\s*น\.?)?(?!\d)/);
    return match ? `${String(match[1]).padStart(2, '0')}:${match[2]}` : '';
  }

  function normalizeOcrYear(year) {
    return year >= 2400 ? year - 543 : year;
  }

  function ocrMonthNumber(monthText) {
    const key = String(monthText || '').toLowerCase().replace(/\./g, '');
    const months = {
      'มค': 1, 'มกราคม': 1, jan: 1, january: 1,
      'กพ': 2, 'กุมภาพันธ์': 2, feb: 2, february: 2,
      'มีค': 3, 'มีนาคม': 3, mar: 3, march: 3,
      'เมย': 4, 'เมษายน': 4, apr: 4, april: 4,
      'พค': 5, 'พฤษภาคม': 5, may: 5,
      'มิย': 6, 'มิถุนายน': 6, jun: 6, june: 6,
      'กค': 7, 'กรกฎาคม': 7, jul: 7, july: 7,
      'สค': 8, 'สิงหาคม': 8, aug: 8, august: 8,
      'กย': 9, 'กันยายน': 9, sep: 9, sept: 9, september: 9,
      'ตค': 10, 'ตุลาคม': 10, oct: 10, october: 10,
      'พย': 11, 'พฤศจิกายน': 11, nov: 11, november: 11,
      'ธค': 12, 'ธันวาคม': 12, dec: 12, december: 12,
    };
    return months[key] || 0;
  }

  function extractOcrTitle(text) {
    return text.split('\n')
      .map((line) => line.trim())
      .filter((line) => line.length >= 3 && !/\d{3,}/.test(line))
      .slice(0, 1)[0] || '';
  }

  function formatDateParts(year, month, day) {
    if (!year || !month || !day || month > 12 || day > 31) return '';
    return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  }

  function renderOcrReviewList() {
    const list = document.getElementById('ocrReviewList');
    const saveButton = document.getElementById('ocrSaveAllBtn');
    saveButton.disabled = !App.ocrItems.length;
    if (!App.ocrItems.length) {
      list.innerHTML = '';
      return;
    }
    list.innerHTML = App.ocrItems.map((item, index) => `
      <div class="ocr-review-item" data-ocr-index="${index}">
        <div class="ocr-review-grid">
          <div>
            <label class="form-label">ชื่อ/หมวดหมู่</label>
            <input class="form-input" data-ocr-field="category" value="${escapeHtml(item.category)}">
          </div>
          <div>
            <label class="form-label">จำนวน</label>
            <input class="form-input" data-ocr-field="amount" type="number" min="0" step="0.01" value="${escapeHtml(item.amount)}">
          </div>
          <div>
            <label class="form-label">วันที่</label>
            <input class="form-input" data-ocr-field="date" type="date" value="${escapeHtml(item.date)}">
          </div>
          <div>
            <label class="form-label">เวลา</label>
            <input class="form-input" data-ocr-field="time" type="time" value="${escapeHtml(item.time)}">
          </div>
          <button class="ghost-icon" data-remove-ocr="${index}" type="button" title="ลบ">
            <i data-lucide="trash-2"></i>
          </button>
        </div>
        <input class="form-input mt-2" data-ocr-field="note" value="${escapeHtml(item.note)}">
      </div>
    `).join('');
    list.querySelectorAll('[data-ocr-field]').forEach((input) => {
      input.addEventListener('input', syncOcrReviewData);
    });
    list.querySelectorAll('[data-remove-ocr]').forEach((button) => {
      button.addEventListener('click', () => {
        App.ocrItems.splice(Number(button.dataset.removeOcr), 1);
        renderOcrReviewList();
      });
    });
    renderIcons();
  }

  function syncOcrReviewData() {
    document.querySelectorAll('[data-ocr-index]').forEach((row) => {
      const index = Number(row.dataset.ocrIndex);
      row.querySelectorAll('[data-ocr-field]').forEach((input) => {
        const field = input.dataset.ocrField;
        App.ocrItems[index][field] = field === 'amount' ? Number(input.value) : input.value;
      });
    });
  }

  async function saveOcrTransactions() {
    syncOcrReviewData();
    const payloads = App.ocrItems
      .filter((item) => Number(item.amount) > 0 && item.category && item.date)
      .map((item) => ({
        type: item.type || 'expense',
        amount: Number(item.amount),
        category: item.category,
        note: item.note || (item.time ? `OCR เวลา ${item.time}` : 'OCR'),
        date: item.date,
        source: 'ocr',
      }));
    if (!payloads.length) {
      showToast('ยังไม่มีรายการ OCR ที่พร้อมบันทึก', true);
      return;
    }
    setLoading(true);
    try {
      App.data = await api('saveTransactions', App.token, payloads);
      closeOcrModal();
      renderAll();
      showToast(`บันทึก OCR แล้ว ${payloads.length} รายการ`);
    } catch (error) {
      showToast(error.message || 'บันทึก OCR ไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  function setHistoryGroup(group) {
    App.historyGroup = group;
    document.querySelectorAll('[data-history-group]').forEach((button) => {
      button.classList.toggle('active', button.dataset.historyGroup === group);
    });
    renderTransactions();
  }

  const HISTORY_LEVEL_LABEL = { day: 'รายวัน', week: 'รายสัปดาห์', month: 'รายเดือน' };

  function parseDateValue_(value) {
    const parts = String(value).split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function startOfWeekSunday_(date) {
    const start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    start.setDate(start.getDate() - start.getDay());
    return start;
  }

  function startOfMonth_(date) {
    return new Date(date.getFullYear(), date.getMonth(), 1);
  }

  function ymd_(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function historyGroupInfo_(tx, level) {
    const date = parseDateValue_(tx.date);
    if (level === 'week') {
      const start = startOfWeekSunday_(date);
      return { key: 'w' + ymd_(start), sortKey: ymd_(start), start: start };
    }
    if (level === 'month') {
      const start = startOfMonth_(date);
      return { key: 'm' + ymd_(start), sortKey: ymd_(start), start: start };
    }
    return { key: 'd' + tx.date, sortKey: tx.date, start: date };
  }

  function historyGroupLabel_(start, level) {
    if (level === 'week') {
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
      const startStr = new Intl.DateTimeFormat('th-TH', sameMonth ? { day: 'numeric' } : { day: 'numeric', month: 'short' }).format(start);
      const endStr = new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }).format(end);
      return `${startStr} – ${endStr}`;
    }
    if (level === 'month') {
      return new Intl.DateTimeFormat('th-TH', { month: 'long', year: 'numeric' }).format(start);
    }
    return new Intl.DateTimeFormat('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(start);
  }

  function historyGroupHeaderHtml_(group, level) {
    return `
      <div class="ledger-group-head">
        <div>
          <p class="card-kicker">${HISTORY_LEVEL_LABEL[level]}</p>
          <span class="date">${escapeHtml(historyGroupLabel_(group.start, level))}</span>
        </div>
        <div class="tot">
          สุทธิช่วงนี้ <b class="${group.income - group.expense >= 0 ? 'amount-income' : 'amount-expense'}">${group.income - group.expense >= 0 ? '+' : ''}${money(group.income - group.expense)}</b>
          &nbsp;·&nbsp; สะสม <b>${money(group.cumBalance)}</b>
        </div>
      </div>
    `;
  }

  function renderTransactions() {
    const list = document.getElementById('transactionList');
    const q = document.getElementById('transactionSearch').value.trim().toLowerCase();
    const level = App.historyGroup || 'day';
    const items = (App.data.transactions || []).filter((tx) => {
      return !q || `${tx.category} ${tx.note} ${tx.date}`.toLowerCase().includes(q);
    });

    if (!items.length) {
      list.innerHTML = emptyHtml('ยังไม่มีรายการ');
      return;
    }

    // Walk chronologically (oldest first) so cumulative totals accrue correctly,
    // then render newest-first with each group carrying its subtotal + running total.
    const ascending = [...items].sort((a, b) => String(a.date + a.createdAt).localeCompare(String(b.date + b.createdAt)));

    const groupOrder = [];
    const groups = {};
    let cumIncome = 0;
    let cumExpense = 0;

    ascending.forEach((tx) => {
      const info = historyGroupInfo_(tx, level);
      if (!groups[info.key]) {
        groups[info.key] = { start: info.start, sortKey: info.sortKey, income: 0, expense: 0, txs: [] };
        groupOrder.push(info.key);
      }
      const amount = Number(tx.amount || 0);
      if (tx.type === 'income') {
        groups[info.key].income += amount;
        cumIncome += amount;
      } else {
        groups[info.key].expense += amount;
        cumExpense += amount;
      }
      groups[info.key].txs.push(tx);
      groups[info.key].cumIncome = cumIncome;
      groups[info.key].cumExpense = cumExpense;
      groups[info.key].cumBalance = cumIncome - cumExpense;
    });

    const orderedGroups = groupOrder.map((key) => groups[key]).sort((a, b) => b.sortKey.localeCompare(a.sortKey));

    list.innerHTML = orderedGroups.map((group) => {
      const rows = [...group.txs]
        .sort((a, b) => String(b.date + b.createdAt).localeCompare(String(a.date + a.createdAt)))
        .map((tx) => ledgerRowHtml(tx, level))
        .join('');
      return `
        <div class="ledger-group">
          ${historyGroupHeaderHtml_(group, level)}
          ${rows}
        </div>
      `;
    }).join('');

    bindTransactionDelete(list);
    renderIcons();
  }

  function ledgerRowHtml(tx, level) {
    const isIncome = tx.type === 'income';
    const source = tx.source === 'recurring' ? ' · อัตโนมัติ' : '';
    // รายวันมีวันที่อยู่ในหัวกลุ่มอยู่แล้ว ส่วนรายสัปดาห์/รายเดือนกำกับวันที่ต่อรายการไว้ด้วย
    const rowDate = level !== 'day' ? rowDateDisplay_(tx.date) : '';
    const time = timeDisplay(tx.createdAt) ? timeDisplay(tx.createdAt) + ' น.' : '';
    const meta = `${rowDate}${rowDate && time ? ' · ' : ''}${time}${source}${tx.note ? ' · ' + escapeHtml(tx.note) : ''}`;
    return `
      <div class="ledger-row" data-tx-id="${tx.transactionId}">
        <div class="desc">${escapeHtml(tx.category)}${meta ? `<span>${meta}</span>` : ''}</div>
        <div class="debit">${!isIncome ? money(tx.amount) : ''}</div>
        <div class="credit">${isIncome ? money(tx.amount) : ''}</div>
        <div class="row-actions">
          <button class="icon-chip-sm" data-edit-tx="${tx.transactionId}" type="button" title="แก้ไขรายการ"><i data-lucide="pencil"></i></button>
          <button class="icon-chip-sm danger" data-delete-tx="${tx.transactionId}" type="button" title="ลบรายการ"><i data-lucide="trash-2"></i></button>
        </div>
      </div>
    `;
  }

  function transactionRowHtml(tx) {
    const isIncome = tx.type === 'income';
    const amount = `${isIncome ? '+' : '-'}${money(tx.amount)}`;
    const note = tx.note ? `<p class="truncate text-xs text-slate-500 dark:text-slate-400">${escapeHtml(tx.note)}</p>` : '';
    const source = tx.source === 'recurring' ? '<span class="status-pill">Auto</span>' : '';
    return `
      <div class="transaction-row">
        <div class="flex min-w-0 items-center gap-3">
          <div class="transaction-icon ${isIncome ? 'income' : 'expense'}">
            <i data-lucide="${isIncome ? 'arrow-down-left' : 'arrow-up-right'}"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <p class="truncate font-extrabold">${escapeHtml(tx.category)}</p>${source}
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">${dateDisplay(tx.date)}${timeDisplay(tx.createdAt) ? ' · บันทึกเวลา ' + timeDisplay(tx.createdAt) + ' น.' : ''}</p>
            ${note}
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <strong class="${isIncome ? 'amount-income' : 'amount-expense'}">${amount}</strong>
          <button class="ghost-icon" data-edit-tx="${tx.transactionId}" type="button" title="แก้ไขรายการ">
            <i data-lucide="pencil"></i>
          </button>
          <button class="ghost-icon" data-delete-tx="${tx.transactionId}" type="button" title="ลบรายการ">
            <i data-lucide="trash-2"></i>
          </button>
        </div>
      </div>
    `;
  }

  function bindTransactionDelete(root) {
    root.querySelectorAll('[data-edit-tx]').forEach((button) => {
      button.addEventListener('click', () => {
        const transaction = (App.data.transactions || []).find((item) => item.transactionId === button.dataset.editTx);
        if (transaction) openTransactionModal(transaction);
      });
    });
    root.querySelectorAll('[data-delete-tx]').forEach((button) => {
      button.addEventListener('click', () => {
        const row = button.closest('.transaction-row');
        const transactionId = button.dataset.deleteTx;
        startUndoDelete({
          message: 'ลบรายการแล้ว',
          onHide: () => { if (row) row.classList.add('is-pending-delete'); },
          onShow: () => { if (row) row.classList.remove('is-pending-delete'); },
          onCommit: async () => {
            setLoading(true);
            try {
              App.data = await api('deleteTransaction', App.token, transactionId);
              renderAll();
            } catch (error) {
              showToast(error.message || 'ลบรายการไม่สำเร็จ', true);
            } finally {
              setLoading(false);
            }
          },
        });
      });
    });
    renderIcons();
  }

  async function moveBudget(budgetId, direction) {
    const budgets = App.data.budgets || [];
    const index = budgets.findIndex((item) => item.budgetId === budgetId);
    if (index < 0) return;
    const swapWith = direction === 'up' ? index - 1 : index + 1;
    if (swapWith < 0 || swapWith >= budgets.length) return;

    const orderedIds = budgets.map((item) => item.budgetId);
    [orderedIds[index], orderedIds[swapWith]] = [orderedIds[swapWith], orderedIds[index]];

    setLoading(true);
    try {
      App.data = await api('reorderBudgets', App.token, orderedIds);
      renderAll();
      if (swapWith === 0 || index === 0) showToast('อัปเดตงบหลักแล้ว');
    } catch (error) {
      showToast(error.message || 'จัดลำดับไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  function daysLeftInPeriod(periodEnd) {
    if (!periodEnd) return null;
    const parts = String(periodEnd).split('-').map(Number);
    const end = new Date(parts[0], parts[1] - 1, parts[2]);
    const now = new Date();
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffDays = Math.round((end.getTime() - todayMid.getTime()) / 86400000) + 1;
    return Math.max(0, diffDays);
  }

  function renderBudgets() {
    document.getElementById('budgetStart').value ||= today();

    const primary = App.data.budget;
    const budgets = App.data.budgets || [];
    const heroBadge = document.getElementById('budgetHeroBadge');
    const heroEditBtn = document.getElementById('budgetHeroEditBtn');
    const heroRisk = document.getElementById('budgetHeroRisk');
    const ringFill = document.getElementById('budgetHeroRingFill');
    const circumference = 2 * Math.PI * 52;
    ringFill.style.strokeDasharray = circumference;

    if (primary && primary.amount) {
      const ratio = Math.max(0, primary.ratio || 0);
      ringFill.style.strokeDashoffset = String(circumference * (1 - Math.min(1, ratio)));
      ringFill.classList.toggle('is-warning', ratio >= 0.8 && ratio <= 1);
      ringFill.classList.toggle('is-danger', ratio > 1);
      document.getElementById('budgetHeroPercent').textContent = `${Math.round(ratio * 100)}%`;
      document.getElementById('budgetHeroName').textContent = primary.category ? primary.category : 'ทุกหมวด';
      heroBadge.classList.remove('hidden');
      heroEditBtn.classList.remove('hidden');
      document.getElementById('budgetHeroSpent').textContent = money(primary.spent);
      const remainEl = document.getElementById('budgetHeroRemain');
      remainEl.textContent = money(primary.remaining);
      remainEl.classList.toggle('is-negative', primary.remaining < 0);

      const daysLeft = daysLeftInPeriod(primary.periodEnd);
      document.getElementById('budgetHeroDaysLeft').textContent = daysLeft !== null ? `${daysLeft} วัน` : '—';
      const dailyAllowanceEl = document.getElementById('budgetHeroDailyAllowance');
      if (primary.remaining <= 0) {
        dailyAllowanceEl.textContent = money(0);
        dailyAllowanceEl.classList.add('is-negative');
      } else if (daysLeft) {
        dailyAllowanceEl.textContent = money(primary.remaining / daysLeft);
        dailyAllowanceEl.classList.remove('is-negative');
      } else {
        dailyAllowanceEl.textContent = '—';
        dailyAllowanceEl.classList.remove('is-negative');
      }

      const stats = primary.overspend || { totalCycles: 0, overCount: 0, overProbabilityPercent: 0 };
      if (primary.overBudget) {
        heroRisk.className = 'budget-hero-risk';
        heroRisk.innerHTML = `<i data-lucide="alert-triangle"></i><span>เกินงบไปแล้ว ${money(Math.abs(primary.remaining))} ในรอบนี้</span>`;
      } else if (stats.totalCycles > 0 && stats.overProbabilityPercent >= 50) {
        heroRisk.className = 'budget-hero-risk';
        heroRisk.innerHTML = `<i data-lucide="alert-triangle"></i><span>ที่ผ่านมาเกินงบ ${stats.overCount}/${stats.totalCycles} รอบ (${stats.overProbabilityPercent}%) — รอบนี้ระวังหน่อยนะ</span>`;
      } else if (stats.totalCycles > 0 && stats.overCount === 0) {
        heroRisk.className = 'budget-hero-risk is-ok';
        heroRisk.innerHTML = `<i data-lucide="thumbs-up"></i><span>ไม่เคยเกินงบเลยใน ${stats.totalCycles} รอบที่ผ่านมา 👍</span>`;
      } else {
        heroRisk.innerHTML = '';
      }
      heroRisk.classList.toggle('hidden', !heroRisk.innerHTML);
    } else {
      ringFill.style.strokeDashoffset = String(circumference);
      ringFill.classList.remove('is-warning', 'is-danger');
      document.getElementById('budgetHeroPercent').textContent = '—';
      document.getElementById('budgetHeroName').textContent = 'ยังไม่ได้ตั้งงบหลัก';
      heroBadge.classList.add('hidden');
      heroEditBtn.classList.add('hidden');
      document.getElementById('budgetHeroSpent').textContent = money(0);
      document.getElementById('budgetHeroRemain').textContent = money(0);
      document.getElementById('budgetHeroDaysLeft').textContent = '—';
      document.getElementById('budgetHeroDailyAllowance').textContent = '—';
      heroRisk.classList.add('hidden');
    }

    const totalAmount = budgets.reduce((sum, item) => sum + Number(item.amount || 0), 0);
    const overCount = budgets.filter((item) => item.overBudget).length;
    document.getElementById('budgetOverviewCount').textContent = `${budgets.length} งบ`;
    document.getElementById('budgetOverviewTotal').textContent = money(totalAmount);
    document.getElementById('budgetOverviewOverCount').textContent = `${overCount} งบ`;
    document.getElementById('budgetOverviewOverChip').classList.toggle('is-danger', overCount > 0);

    const filterToggle = document.getElementById('budgetOverFilterToggle');
    filterToggle.classList.toggle('active', App.budgetShowOverOnly);
    filterToggle.textContent = overCount ? `เกินงบเท่านั้น (${overCount})` : 'เกินงบเท่านั้น';

    const list = document.getElementById('budgetList');
    const visibleBudgets = App.budgetShowOverOnly ? budgets.filter((item) => item.overBudget) : budgets;
    list.innerHTML = visibleBudgets.length ? visibleBudgets.map((budget) => {
      const index = budgets.indexOf(budget);
      const isPrimary = index === 0;

      const barClass = budget.overBudget ? 'danger' : (budget.ratio >= 0.8 ? 'warning' : '');
      const pillClass = budget.overBudget ? 'is-danger-pill' : (budget.ratio >= 0.8 ? 'is-warning-pill' : 'is-ok-pill');
      const ringStatusClass = budget.overBudget ? 'danger' : (budget.ratio >= 0.8 ? 'warning' : '');
      const ringCircumference = 2 * Math.PI * 16;
      const daysLeft = daysLeftInPeriod(budget.periodEnd);
      const cardClass = budget.overBudget ? 'is-over-budget' : (isPrimary ? 'is-primary-budget' : '');
      const accentColor = categoryColorFor(budget.category);
      const accentStyle = accentColor ? ` style="--accent:${accentColor}"` : '';
      const stepper = App.budgetShowOverOnly ? '' : `
        <div class="order-stepper">
          <button data-move-budget="up" data-budget-order-id="${budget.budgetId}" type="button" title="เลื่อนขึ้น" ${index === 0 ? 'disabled' : ''}><i data-lucide="chevron-up"></i></button>

      return `

          <div class="flex items-center gap-1" style="flex-wrap:wrap;">

            <button class="icon-chip-sm danger" data-delete-budget="${budget.budgetId}" type="button" title="ลบ"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
        <div class="envelope-head-row">
          <div class="goal-ring-badge ${ringStatusClass}">
            <svg viewBox="0 0 36 36">
              <circle class="ring-track" cx="18" cy="18" r="16"></circle>
              <circle class="ring-fill" cx="18" cy="18" r="16" style="stroke-dasharray:${ringCircumference};stroke-dashoffset:${ringCircumference * (1 - ratioClamped)}"></circle>
            </svg>
            <span class="ring-icon-bg"></span>
            <span class="ring-icon"><i data-lucide="${budgetIconFor(budget.category)}"></i></span>
          </div>
          <div class="min-w-0">

            <strong class="amt">${money(budget.amount)}</strong>
          </div>
        </div>
        <div class="track"><i class="${barClass}" style="width:${Math.min(100, Math.round(budget.ratio * 100))}%"></i></div>
        <small>ใช้ไป ${money(budget.spent)} · ${App.periodLabel[budget.period] || budget.period}</small>
        <div style="margin-top:.4rem;">
          <span class="budget-days-left"><i data-lucide="calendar-clock"></i>${daysLeft !== null ? `เหลือ ${daysLeft} วันในรอบนี้` : ''}</span>
        </div>
      </div>
    `;
    }).join('') : emptyHtml(App.budgetShowOverOnly ? 'ไม่มีงบที่เกินอยู่ตอนนี้ 🎉' : 'ยังไม่ได้ตั้งงบประมาณ');

    list.querySelectorAll('[data-move-budget]').forEach((button) => {
      button.addEventListener('click', () => moveBudget(button.dataset.budgetOrderId, button.dataset.moveBudget));

    list.querySelectorAll('[data-edit-budget]').forEach((button) => {

    const wrap = document.getElementById('savingsLogQuickAmounts');
    const goal = App.savingsLogModalGoal;
    const chips = SAVINGS_QUICK_AMOUNTS.map((value) => `<button type="button" class="quick-amount-chip" data-quick-amount="${value}">+${value.toLocaleString('th-TH')}</button>`);
    if (direction === 'withdraw' && goal && goal.saved > 0) {
      chips.push(`<button type="button" class="quick-amount-chip is-max" data-quick-amount="${goal.saved}">ถอนทั้งหมด</button>`);
    }
    wrap.innerHTML = chips.join('');
    wrap.querySelectorAll('[data-quick-amount]').forEach((button) => {
      button.addEventListener('click', () => {
        document.getElementById('savingsLogAmount').value = button.dataset.quickAmount;
      });
    });

  function openSavingsLogModal(goal, direction) {
    App.savingsLogModalGoal = goal;
    document.getElementById('savingsLogGoalId').value = goal.savingsGoalId;
    document.getElementById('savingsLogGoalName').textContent =
      `${goal.name} · ออมแล้ว ${money(goal.saved)}${goal.targetAmount ? ' จากเป้า ' + money(goal.targetAmount) : ''}`;
    document.getElementById('savingsLogAmount').value = '';
    document.getElementById('savingsLogNote').value = '';
    document.getElementById('savingsLogDate').value = today();
    setSavingsDirection(direction || 'deposit');
    document.getElementById('savingsLogModal').classList.remove('hidden');
    trackModalOpen('savingsLogModal', '#savingsLogAmount');
    renderIcons();
  }

  function closeSavingsLogModal() {
    const modal = document.getElementById('savingsLogModal');
    if (!modal || modal.classList.contains('hidden')) return;
    modal.classList.add('hidden');
    trackModalClose();
    App.savingsLogModalGoal = null;
  }

  async function submitSavingsLog(event) {
    event.preventDefault();
    const payload = {
      savingsGoalId: document.getElementById('savingsLogGoalId').value,
      direction: document.getElementById('savingsLogDirection').value,
      amount: Number(document.getElementById('savingsLogAmount').value),
      note: document.getElementById('savingsLogNote').value,
      date: document.getElementById('savingsLogDate').value,
    };
    setLoading(true);
    const prevCompletedIds = ((App.data && App.data.savingsGoals) || [])
      .filter((goal) => goal.completed)
      .map((goal) => goal.savingsGoalId);
    try {
      App.data = await api('saveSavingsLog', App.token, payload);
      closeSavingsLogModal();
      renderAll();
      const justCompletedGoal = (App.data.savingsGoals || [])
        .find((goal) => goal.savingsGoalId === payload.savingsGoalId && goal.completed && prevCompletedIds.indexOf(goal.savingsGoalId) < 0);
      if (payload.direction !== 'withdraw' && justCompletedGoal) {
        showToast(`🎉 บรรลุเป้าหมาย "${justCompletedGoal.name}" แล้ว!`);
        celebrateSavingsGoal();
      } else {
        showToast(payload.direction === 'withdraw' ? 'ถอนเงินออมแล้ว' : 'ฝากเงินออมแล้ว');
      }
    } catch (error) {
      showToast(error.message || 'บันทึกไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  function celebrateSavingsGoal() {
    const colors = ['#3f6b52', '#a97a24', '#a03f2c', '#2c4c3a', '#c4635a'];
    const layer = document.createElement('div');
    layer.className = 'confetti-layer';
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      piece.style.animationDuration = (1.1 + Math.random() * 0.9) + 's';
      layer.appendChild(piece);
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 2600);
  }

  function removeSavingsLog(savingsLogId, triggerEl) {
    const row = triggerEl ? triggerEl.closest('.transaction-row') : null;
    startUndoDelete({
      message: 'ลบรายการแล้ว',
      onHide: () => { if (row) row.classList.add('is-pending-delete'); },
      onShow: () => { if (row) row.classList.remove('is-pending-delete'); },
      onCommit: async () => {
        setLoading(true);
        try {
          App.data = await api('deleteSavingsLog', App.token, savingsLogId);
          renderAll();
        } catch (error) {
          showToast(error.message || 'ลบรายการไม่สำเร็จ', true);
        } finally {
          setLoading(false);
        }
      },
    });
  }

  function savingsLogRowHtml(log, goalName) {
    const isDeposit = log.direction !== 'withdraw';
    const amount = `${isDeposit ? '+' : '-'}${money(log.amount)}`;
    const note = log.note ? `<p class="truncate text-xs text-slate-500 dark:text-slate-400">${escapeHtml(log.note)}</p>` : '';
    return `
      <div class="transaction-row">
        <div class="flex min-w-0 items-center gap-3">
          <div class="transaction-icon ${isDeposit ? 'income' : 'expense'}">
            <i data-lucide="${isDeposit ? 'arrow-down-to-line' : 'arrow-up-from-line'}"></i>
          </div>
          <div class="min-w-0">
            <p class="truncate font-extrabold">${escapeHtml(goalName || 'เป้าหมายที่ถูกลบ')}</p>
            <p class="text-xs text-slate-500 dark:text-slate-400">${dateDisplay(log.date)}</p>
            ${note}
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <strong class="${isDeposit ? 'amount-income' : 'amount-expense'}">${amount}</strong>
          <button class="ghost-icon" data-delete-savings-log="${log.savingsLogId}" type="button" title="ลบรายการ">
            <i data-lucide="trash-2"></i>
          </button>
        </div>
      </div>
    `;
  }

  function goalRingBadgeHtml(goal) {
    const circumference = 2 * Math.PI * 16;
    const ratio = goal.targetAmount ? Math.max(0, Math.min(1, goal.ratio)) : 0;
    const offset = circumference * (1 - ratio);
    const statusClass = goal.completed ? 'completed' : (goal.ratio >= 0.8 ? 'warning' : '');
    return `
      <div class="goal-ring-badge ${statusClass}">
        <svg viewBox="0 0 36 36">
          <circle class="ring-track" cx="18" cy="18" r="16"></circle>
          <circle class="ring-fill" cx="18" cy="18" r="16" style="stroke-dasharray:${circumference};stroke-dashoffset:${goal.targetAmount ? offset : circumference}"></circle>
        </svg>
        <span class="ring-icon-bg"></span>
        <span class="ring-icon"><i data-lucide="${goal.icon || 'piggy-bank'}"></i></span>
      </div>
    `;
  }

  function sortSavingsGoals(goals) {
    const sorted = goals.slice();
    if (App.savingsSort === 'progress') {
      sorted.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        return b.ratio - a.ratio;
      });
    } else if (App.savingsSort === 'name') {
      sorted.sort((a, b) => a.name.localeCompare(b.name, 'th'));
    }
    return sorted;
  }

  function renderSavings() {
    const summary = App.data.savingsSummary || { totalSaved: 0, availableBalance: 0, totalTarget: 0, goalsCount: 0, completedCount: 0 };
    document.getElementById('savingsTotalSaved').textContent = money(summary.totalSaved);
    const balanceEl = document.getElementById('savingsAvailableBalance');
    balanceEl.textContent = money(summary.availableBalance);
    balanceEl.classList.toggle('is-negative', summary.availableBalance < 0);
    document.getElementById('savingsGoalsCount').textContent = `${summary.goalsCount} เป้าหมาย`;
    document.getElementById('savingsCompletedCount').textContent = `${summary.completedCount} เป้าหมาย`;

    const heroRatio = summary.totalTarget > 0 ? Math.max(0, Math.min(1, summary.totalSaved / summary.totalTarget)) : 0;
    const heroCircumference = 2 * Math.PI * 52;
    document.getElementById('savingsHeroRingFill').style.strokeDasharray = heroCircumference;
    document.getElementById('savingsHeroRingFill').style.strokeDashoffset = heroCircumference * (1 - heroRatio);
    document.getElementById('savingsHeroRingPercent').textContent = summary.totalTarget > 0 ? Math.round(heroRatio * 100) + '%' : '—';

    const goals = App.data.savingsGoals || [];

    const goalFilterSelect = document.getElementById('savingsLogGoalFilter');
    const currentGoalFilter = App.savingsLogFilter.goalId;
    goalFilterSelect.innerHTML = '<option value="">ทุกเป้าหมาย</option>' +
      goals.map((goal) => `<option value="${goal.savingsGoalId}">${escapeHtml(goal.name)}</option>`).join('');
    goalFilterSelect.value = currentGoalFilter;

    const goalList = document.getElementById('savingsGoalList');
    const sortedGoals = sortSavingsGoals(goals);
    goalList.innerHTML = sortedGoals.length ? sortedGoals.map((goal) => {
      const progressHtml = goal.targetAmount
        ? `<small>เหลืออีก ${money(goal.remaining)} จากเป้า ${money(goal.targetAmount)}</small>`
        : `<small>${goal.note ? escapeHtml(goal.note) : 'ยังไม่ได้ตั้งเป้าหมาย'}</small>`;
      // เป้าหมายที่สำเร็จแล้วใช้โทนเขียวเฉลิมฉลองของตัวเองอยู่แล้ว เลยไม่ใส่สีสุ่มทับ กันดูรกตา
      const accentColor = goal.completed ? '' : colorForSeed(goal.savingsGoalId);
      const accentStyle = accentColor ? ` style="--accent:${accentColor}"` : '';
      return `
      <div class="envelope is-savings ${goal.completed ? 'is-goal-complete' : ''}" data-savings-goal-id="${goal.savingsGoalId}"${accentStyle}>
        <div class="envelope-top">
          <span class="status-pill">${goal.completed ? 'สำเร็จแล้ว 🎉' : (goal.targetAmount ? goal.percent + '%' : 'ไม่มีเป้าหมาย')}</span>
          <div class="envelope-actions">
            <button class="icon-chip-sm" data-edit-savings-goal="${goal.savingsGoalId}" type="button" title="แก้ไข"><i data-lucide="pencil"></i></button>
            <button class="icon-chip-sm danger" data-delete-savings-goal="${goal.savingsGoalId}" type="button" title="ลบ"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
        <div class="envelope-head-row">
          ${goalRingBadgeHtml(goal)}
          <div class="min-w-0">
            <p class="cat truncate">${escapeHtml(goal.name)}</p>
            <strong class="amt">${money(goal.saved)}</strong>
          </div>
        </div>
        ${progressHtml}
        <div class="envelope-actions-row">
          <button class="mini-btn" data-deposit-goal="${goal.savingsGoalId}" type="button"><i data-lucide="arrow-down-to-line"></i>ฝาก</button>
          <button class="mini-btn is-withdraw" data-withdraw-goal="${goal.savingsGoalId}" type="button"><i data-lucide="arrow-up-from-line"></i>ถอน</button>
        </div>
      </div>
    `;
    }).join('') : `<div class="empty-state" style="width:100%;">
        ยังไม่มีเป้าหมายการออม — เริ่มต้นเก็บเงินเพื่อสิ่งที่ตั้งใจไว้กันเลย
        <div style="margin-top:.85rem;"><button class="secondary-btn" type="button" data-open-savings-goal-form><i data-lucide="plus"></i><span>เพิ่มเป้าหมายแรก</span></button></div>
      </div>`;

    const emptyGoalCta = goalList.querySelector('[data-open-savings-goal-form]');
    if (emptyGoalCta) emptyGoalCta.addEventListener('click', () => openSavingsGoalFormModal());

    goalList.querySelectorAll('[data-edit-savings-goal]').forEach((button) => {
      button.addEventListener('click', () => {
        const goal = goals.find((item) => item.savingsGoalId === button.dataset.editSavingsGoal);
        if (goal) openSavingsGoalFormModal(goal);
      });
    });
    goalList.querySelectorAll('[data-delete-savings-goal]').forEach((button) => {
      button.addEventListener('click', () => removeSavingsGoal(button.dataset.deleteSavingsGoal, button));
    });
    goalList.querySelectorAll('[data-deposit-goal]').forEach((button) => {
      button.addEventListener('click', () => {
        const goal = goals.find((item) => item.savingsGoalId === button.dataset.depositGoal);
        if (goal) openSavingsLogModal(goal, 'deposit');
      });
    });
    goalList.querySelectorAll('[data-withdraw-goal]').forEach((button) => {
      button.addEventListener('click', () => {
        const goal = goals.find((item) => item.savingsGoalId === button.dataset.withdrawGoal);
        if (goal) openSavingsLogModal(goal, 'withdraw');
      });
    });

    const goalNameById = {};
    goals.forEach((goal) => { goalNameById[goal.savingsGoalId] = goal.name; });
    const logList = document.getElementById('savingsLogList');
    const filter = App.savingsLogFilter;
    const logs = (App.data.savingsLogs || []).filter((log) => {
      if (filter.goalId && log.savingsGoalId !== filter.goalId) return false;
      if (filter.direction && log.direction !== filter.direction) return false;
      if (filter.search) {
        const haystack = `${goalNameById[log.savingsGoalId] || ''} ${log.note || ''}`.toLowerCase();
        if (haystack.indexOf(filter.search) < 0) return false;
      }
      return true;
    });
    logList.innerHTML = logs.length
      ? logs.map((log) => savingsLogRowHtml(log, goalNameById[log.savingsGoalId])).join('')
      : emptyHtml((App.data.savingsLogs || []).length ? 'ไม่พบรายการที่ตรงกับตัวกรอง' : 'ยังไม่มีประวัติการฝาก-ถอน');
    logList.querySelectorAll('[data-delete-savings-log]').forEach((button) => {
      button.addEventListener('click', () => removeSavingsLog(button.dataset.deleteSavingsLog, button));
    });

    renderIcons();
  }

  function renderBudgetOverspendStats() {
    const wrap = document.getElementById('budgetOverspendList');
    if (!wrap) return;
    const budgets = App.data.budgets || [];
    if (!budgets.length) {
      wrap.innerHTML = emptyHtml('ยังไม่มีงบประมาณที่ตั้งไว้');
      return;
    }

    wrap.innerHTML = budgets.map((budget) => {
      const stats = budget.overspend || { totalCycles: 0, overCount: 0, overProbabilityPercent: 0, totalOverAmount: 0, avgOverPercent: 0, avgSpent: 0 };
      const name = budget.category ? escapeHtml(budget.category) : 'ทุกหมวด';
      const periodLabel = App.periodLabel[budget.period] || budget.period;
      // งบรายวัน/รายสัปดาห์ดูสถิติย้อนหลัง 1 เดือน ส่วนงบรายเดือนดูย้อนหลัง 1 ปี (ดูฝั่ง Code.js: computeBudgetOverspendStats_)
      const windowLabel = budget.period === 'monthly' ? 'ใน 1 ปีที่ผ่านมา' : 'ใน 1 เดือนที่ผ่านมา';

      if (!stats.totalCycles) {
        return `
          <div class="overspend-card">
            <div class="overspend-card-head">
              <span class="name">${name} <span class="status-pill">${periodLabel}</span></span>
            </div>
            <p class="overspend-note">ยังไม่มีรอบงบประมาณที่ครบกำหนด${windowLabel} รอครบรอบแรกก่อนถึงจะเริ่มเก็บสถิติได้</p>
          </div>
        `;
      }

      // เคยเกินงบอย่างน้อย 1 ครั้งเท่านั้นถึงจะแสดงสถิติแบบเต็ม ส่วนที่ยังไม่เคยเกินโชว์แค่บรรทัดสั้น ๆ
      if (!stats.overCount) {
        return `
          <div class="overspend-card">
            <div class="overspend-card-head">
              <span class="name">${name} <span class="status-pill">${periodLabel}</span></span>
              <span class="status-pill ok">ยังไม่เกินงบ</span>
            </div>
            <p class="overspend-note">ยังไม่เคยเกินงบใน ${stats.totalCycles} รอบที่ผ่านมา${windowLabel} (วงเงิน ${money(budget.amount)})</p>
          </div>
        `;
      }

      const pillClass = 'danger';
      const pillText = `เกินงบ ${stats.overCount}/${stats.totalCycles} รอบ`;

      return `
        <div class="overspend-card">
          <div class="overspend-card-head">
            <span class="name">${name}</span>
            <span class="status-pill ${pillClass}">${periodLabel} · ${pillText}</span>
          </div>
          <div class="overspend-grid">
            <div class="overspend-stat">
              <span class="lbl">จำนวนครั้งที่เกินงบ</span>
              <span class="val ${stats.overCount ? 'danger' : ''}">${stats.overCount} ครั้ง</span>
            </div>
            <div class="overspend-stat">
              <span class="lbl">ยอดที่เกินสะสม</span>
              <span class="val ${stats.totalOverAmount ? 'danger' : ''}">${money(stats.totalOverAmount)}</span>
            </div>
            <div class="overspend-stat">
              <span class="lbl">เกินเฉลี่ยต่อรอบที่เกิน</span>
              <span class="val ${stats.avgOverPercent ? 'danger' : ''}">${stats.avgOverPercent}%</span>
            </div>
            <div class="overspend-stat">
              <span class="lbl">โอกาสใช้เกินงบ</span>
              <span class="val ${stats.overProbabilityPercent >= 50 ? 'danger' : ''}">${stats.overProbabilityPercent}%</span>
            </div>
          </div>
          <p class="overspend-note">ใช้จ่ายเฉลี่ย ${money(stats.avgSpent)} ต่อรอบ จากทั้งหมด ${stats.totalCycles} รอบ${windowLabel} (วงเงิน ${money(budget.amount)})</p>
        </div>
      `;
    }).join('');
  }

  const App_categoryPalette = ['#2c4c3a', '#a03f2c', '#a97a24', '#7c7057', '#5f8f74', '#c1785a', '#8a7f5f', '#3f6b52'];

  function syncChartTheme() {
    if (typeof Chart === 'undefined') return;
    const styles = getComputedStyle(document.documentElement);
    Chart.defaults.font.family = "'Sarabun', 'Inter', sans-serif";
    Chart.defaults.color = styles.getPropertyValue('--text-soft').trim() || '#7c7057';
    Chart.defaults.borderColor = styles.getPropertyValue('--line').trim() || '#ddceac';
  }

  function renderCategoryBreakdown() {
    const list = document.getElementById('categoryBreakdownList');
    const items = App.data.analytics.categoryExpense || [];
    if (!list) return;
    list.innerHTML = categoryRowsHtml(items) || emptyHtml('ยังไม่มีรายจ่ายในช่วงนี้');
  }

  function categoryRowsHtml(items) {
    if (!items || !items.length) return '';
    const total = items.reduce((sum, item) => sum + item.amount, 0) || 1;
    return items.map((item, index) => `
      <div class="cat-row">
        <span class="dot" style="background:${App_categoryPalette[index % App_categoryPalette.length]}"></span>
        <span class="name">${escapeHtml(item.category)}</span>
        <span class="amt">${money(item.amount)}</span>
        <span class="pct">${Math.round((item.amount / total) * 100)}%</span>
      </div>
    `).join('');
  }

  function renderCompareCard(id, title, stat) {
    const change = stat.expenseChangePercent;
    const isUp = change > 0;
    const isDown = change < 0;
    document.getElementById(id).innerHTML = `
      <span class="l">${escapeHtml(title)}</span>
      <span class="v ${isUp ? 'up' : isDown ? 'down' : ''}">${isUp ? '▲' : isDown ? '▼' : '•'} ${Math.abs(change)}%</span>
      <p class="cap">รายจ่าย ${money(stat.expense)} · คงเหลือ ${money(stat.balance)}</p>
    `;
  }

  function drawExpensePie() {
    const ctx = document.getElementById('expensePie');
    const items = App.data.analytics.categoryExpense;
    if (App.charts.expensePie) App.charts.expensePie.destroy();
    App.charts.expensePie = new Chart(ctx, {
      type: 'doughnut',

        labels: items.map((item) => item.category),
        datasets: [{
          data: items.map((item) => item.amount),
          backgroundColor: App_categoryPalette,
          borderWidth: 0,

      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } },
        },
        cutout: '62%',
      },
    });
  }

  function drawPeriodBar() {
    const ctx = document.getElementById('periodBar');

        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { grid: { display: false } },
          y: { beginAtZero: true },
        },
        plugins: {
          legend: { position: 'bottom' },
        },
      },
    });
  }

            <button data-move-category="down" data-category-order-id="${category.categoryId}" type="button" title="เลื่อนลง" ${index === items.length - 1 ? 'disabled' : ''}><i data-lucide="chevron-down"></i></button>
