        </div>
      </div>
    `).join('') : emptyHtml('ยังไม่มีหมวดหมู่');

    list.querySelectorAll('[data-move-category]').forEach((button) => {
      button.addEventListener('click', () => moveCategory(button.dataset.categoryOrderId, button.dataset.moveCategory));
    });
    list.querySelectorAll('[data-edit-category]').forEach((button) => {
      button.addEventListener('click', () => {
        const category = items.find((item) => item.categoryId === button.dataset.editCategory);
        if (category) openCategoryFormModal(category);
      });
    });
    list.querySelectorAll('[data-delete-category]').forEach((button) => {
      button.addEventListener('click', () => {
        const row = button.closest('.category-row');
        const categoryId = button.dataset.deleteCategory;
        startUndoDelete({
          message: 'ลบหมวดหมู่แล้ว',
          onHide: () => { if (row) row.classList.add('is-pending-delete'); },
          onShow: () => { if (row) row.classList.remove('is-pending-delete'); },
          onCommit: async () => {
            setLoading(true);
            try {
              App.data = await api('deleteCategory', App.token, categoryId);
              renderAll();
            } catch (error) {
              showToast(error.message || 'ลบหมวดหมู่ไม่สำเร็จ', true);
              renderCategoryManager();
            } finally {
              setLoading(false);
            }
          },
        });
      });
    });
    renderIcons();
  }

  async function moveCategory(categoryId, direction) {
    const type = App.categoryManagerType;
    const items = (App.data.categories[type] || []).slice().sort((a, b) => a.sortOrder - b.sortOrder);
    const index = items.findIndex((item) => item.categoryId === categoryId);
    if (index < 0) return;
    const swapWith = direction === 'up' ? index - 1 : index + 1;
    if (swapWith < 0 || swapWith >= items.length) return;

    const orderedIds = items.map((item) => item.categoryId);
    [orderedIds[index], orderedIds[swapWith]] = [orderedIds[swapWith], orderedIds[index]];

    setLoading(true);
    try {
      App.data = await api('reorderCategories', App.token, type, orderedIds);
      renderAll();
    } catch (error) {
      showToast(error.message || 'จัดลำดับไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  function renderCategoryIconPicker(selectedIcon) {
    const picker = document.getElementById('categoryIconPicker');
    const active = selectedIcon || 'tag';
    picker.innerHTML = CATEGORY_ICONS.map((icon) => `
      <button type="button" data-category-icon-choice="${icon}" class="${icon === active ? 'active' : ''}" title="${icon}">
        <i data-lucide="${icon}"></i>
      </button>
    `).join('');
    picker.querySelectorAll('[data-category-icon-choice]').forEach((button) => {
      button.addEventListener('click', () => {
        document.getElementById('categoryIcon').value = button.dataset.categoryIconChoice;
        picker.querySelectorAll('[data-category-icon-choice]').forEach((item) => item.classList.toggle('active', item === button));
      });
    });
  }

  function renderCategoryColorPicker(selectedColor) {
    const picker = document.getElementById('categoryColorPicker');
    const active = selectedColor || CATEGORY_COLORS[0];
    picker.innerHTML = CATEGORY_COLORS.map((color) => `
      <button type="button" data-category-color-choice="${color}" class="${color === active ? 'active' : ''}" style="background:${color}" title="${color}"></button>
    `).join('');
    picker.querySelectorAll('[data-category-color-choice]').forEach((button) => {
      button.addEventListener('click', () => {
        document.getElementById('categoryColor').value = button.dataset.categoryColorChoice;
        picker.querySelectorAll('[data-category-color-choice]').forEach((item) => item.classList.toggle('active', item === button));
      });
    });
  }

  function openCategoryFormModal(category) {
    document.getElementById('categoryFormModalTitle').textContent = category ? 'แก้ไขหมวดหมู่' : 'เพิ่มหมวดหมู่';
    document.getElementById('categoryEditingId').value = category ? category.categoryId : '';
    document.getElementById('categoryEditingType').value = category ? category.type : App.categoryManagerType;
    document.getElementById('categoryName').value = category ? category.name : '';
    document.getElementById('categoryIcon').value = category ? category.icon : 'tag';
    document.getElementById('categoryColor').value = category ? category.color : CATEGORY_COLORS[0];
    renderCategoryIconPicker(document.getElementById('categoryIcon').value);
    renderCategoryColorPicker(document.getElementById('categoryColor').value);
    document.getElementById('categorySubmitLabel').textContent = category ? 'บันทึกการแก้ไข' : 'บันทึกหมวดหมู่';
    renderIcons();
  }

  async function submitCategory(event) {
    event.preventDefault();
    const payload = {
      categoryId: document.getElementById('categoryEditingId').value,
      type: document.getElementById('categoryEditingType').value,
      name: document.getElementById('categoryName').value,
      icon: document.getElementById('categoryIcon').value,
      color: document.getElementById('categoryColor').value,
    };
    setLoading(true);
    try {
      App.data = await api('saveCategory', App.token, payload);
      document.getElementById('categoryFormModal').classList.add('hidden');
      document.body.classList.remove('modal-open');
      document.getElementById('categoryForm').reset();
      renderAll();
      showToast('บันทึกหมวดหมู่แล้ว');
    } catch (error) {
      showToast(error.message || 'บันทึกหมวดหมู่ไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  // ============ ส่งออกข้อมูลเป็น CSV ============
  function csvEscape_(value) {
    const str = String(value === undefined || value === null ? '' : value);
    if (/[",\r\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
    return str;
  }

  function downloadCsv_(filename, rows) {
    const csv = rows.map((row) => row.map(csvEscape_).join(',')).join('\r\n');
    // ใส่ BOM นำหน้าเพื่อให้ Excel เปิดอ่านภาษาไทยได้ถูกต้อง ไม่เป็นตัวอักษรมั่ว
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportTransactionsCsv() {
    const rows = [['วันที่', 'ประเภท', 'หมวดหมู่', 'จำนวนเงิน', 'โน้ต']];
    (App.data.transactions || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).forEach((tx) => {
      rows.push([tx.date, tx.type === 'income' ? 'รายรับ' : 'รายจ่าย', tx.category, tx.amount, tx.note || '']);
    });
    downloadCsv_(`finnote-transactions-${today()}.csv`, rows);
    showToast('ดาวน์โหลดไฟล์ CSV แล้ว');
  }

  function exportSavingsCsv() {
    const goalNameById = {};
    (App.data.savingsGoals || []).forEach((goal) => { goalNameById[goal.savingsGoalId] = goal.name; });
    const rows = [['วันที่', 'เป้าหมาย', 'ประเภท', 'จำนวนเงิน', 'โน้ต']];
    (App.data.savingsLogs || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).forEach((log) => {
      rows.push([log.date, goalNameById[log.savingsGoalId] || '', log.direction === 'withdraw' ? 'ถอน' : 'ฝาก', log.amount, log.note || '']);
    });
    downloadCsv_(`finnote-savings-${today()}.csv`, rows);
    showToast('ดาวน์โหลดไฟล์ CSV แล้ว');
  }

  function hydrateSettings() {
    const settings = App.data.settings;
    document.getElementById('emailNotifications').checked = settings.emailNotifications;
    const reminderInput = document.getElementById('reminderTime');
    if (document.activeElement !== reminderInput) {
      reminderInput.value = settings.reminderTime || '20:00';
    }
    document.getElementById('budgetAlertThreshold').value = String(settings.budgetAlertThreshold || 0.8);
  }

  async function submitSettings(event) {
    event.preventDefault();
    const payload = {
      emailNotifications: document.getElementById('emailNotifications').checked,
      reminderTime: document.getElementById('reminderTime').value,
      budgetAlertThreshold: Number(document.getElementById('budgetAlertThreshold').value),
    };
    setLoading(true);
    try {
      App.data = await api('updateSettings', App.token, payload);
      renderAll();
      showToast('บันทึกการตั้งค่าแล้ว');
    } catch (error) {
      showToast(error.message || 'บันทึกการตั้งค่าไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  function readProfileImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 750000) {
      showToast('รูปใหญ่เกินไป กรุณาเลือกรูปไม่เกิน 750KB', true);
      event.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      App.profileImageDraft = reader.result;
      document.getElementById('settingsAvatar').src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  async function submitProfile(event) {
    event.preventDefault();
    const payload = {
      displayName: document.getElementById('settingsDisplayName').value,
    };
    if (App.profileImageDraft) payload.profileImage = App.profileImageDraft;
    setLoading(true);
    try {
      App.data = await api('updateProfile', App.token, payload);
      App.profileImageDraft = '';
      renderAll();
      showToast('บันทึกโปรไฟล์แล้ว');
    } catch (error) {
      showToast(error.message || 'บันทึกโปรไฟล์ไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  async function submitDeleteAccount(event) {
    event.preventDefault();
    const password = document.getElementById('deleteAccountPassword').value;
    if (!confirm('ยืนยันลบข้อมูลบัญชีถาวร? รายการ งบประมาณ รายการประจำ และโปรไฟล์ทั้งหมดจะหายไปและไม่สามารถกู้คืนได้')) return;
    setLoading(true);
    try {
      await api('deleteAccount', App.token, { password });
      sessionStorage.removeItem('moneyflow_session');
      localStorage.removeItem('moneyflow_remember');
      App.token = '';
      App.rememberToken = '';
      App.data = null;
      document.getElementById('deleteAccountForm').reset();
      showToast('ลบข้อมูลบัญชีเรียบร้อยแล้ว');
      showAuth();
    } catch (error) {
      showToast(error.message || 'ลบบัญชีไม่สำเร็จ', true);
    } finally {
      setLoading(false);
    }
  }

  function setTodayLabel() {
    document.getElementById('todayLabel').textContent = new Intl.DateTimeFormat('th-TH', {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric',
    }).format(new Date());
  }

  function setLoading(isLoading) {
    document.getElementById('loadingOverlay').classList.toggle('hidden', !isLoading);
  }

  let activeUndo_ = null;

  // ทดแทน confirm() สำหรับการลบ — ซ่อนรายการทันที (ยังลบจริงไม่เกิดขึ้น) พร้อมโชว์ toast ให้กด
  // "เลิกทำ" ได้ภายในเวลาที่กำหนด ถ้าไม่กดจะเรียก onCommit (เช่น ยิง API ลบจริง) เมื่อหมดเวลา
  function startUndoDelete({ message, onHide, onShow, onCommit, duration = 5000 }) {
    if (activeUndo_) {
      clearTimeout(activeUndo_.timer);
      activeUndo_.commit();
    }
    if (onHide) onHide();

    const toast = document.getElementById('undoToast');
    document.getElementById('undoToastMessage').textContent = message;
    toast.classList.remove('hidden');
    const bar = toast.querySelector('.undo-progress');
    bar.style.animation = 'none';
    void bar.offsetWidth;
    bar.style.animation = `undo-countdown ${duration}ms linear forwards`;

    const commit = () => {
      toast.classList.add('hidden');
      activeUndo_ = null;
      onCommit();
    };
    const timer = setTimeout(commit, duration);
    activeUndo_ = {
      timer,
      commit,
      cancel: () => {
        clearTimeout(timer);
        toast.classList.add('hidden');
        activeUndo_ = null;
        if (onShow) onShow();
      },
    };
  }

  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.toggle('error', Boolean(isError));
    toast.classList.remove('hidden');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.add('hidden'), 3200);
  }

  function renderIcons() {
    if (window.lucide) lucide.createIcons();
  }

  function money(value) {
    return Number(value || 0).toLocaleString('th-TH', {
      style: 'currency',
      currency: 'THB',
      minimumFractionDigits: 0,
      maximumFractionDigits: 2,
    });
  }

  function today() {
    const date = new Date();
    date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
    return date.toISOString().slice(0, 10);
  }

  function currentTime() {
    const date = new Date();
    return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
  }

  function dateDisplay(value) {
    if (!value) return '';
    const parts = String(value).split('-').map(Number);
    return new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', year: 'numeric' })
      .format(new Date(parts[0], parts[1] - 1, parts[2]));
  }

  // วันที่แบบสั้น (ไม่มีปี) สำหรับกำกับรายการย่อยในหน้าประวัติเมื่อจัดกลุ่มแบบรายสัปดาห์/รายเดือน
  function rowDateDisplay_(value) {
    if (!value) return '';
    const parts = String(value).split('-').map(Number);
    return new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short' })
      .format(new Date(parts[0], parts[1] - 1, parts[2]));
  }

  function timeDisplay(isoValue) {
    if (!isoValue) return '';
    const parsed = new Date(isoValue);
    if (Number.isNaN(parsed.getTime())) return '';
    return new Intl.DateTimeFormat('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false }).format(parsed);
  }

  function avatarDataUrl(name) {
    const initials = String(name || 'M').trim().slice(0, 2).toUpperCase();
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="18" fill="#14b8a6"/>
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="42" font-weight="800" fill="white">${escapeHtml(initials)}</text>
      </svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function emptyHtml(text) {
    return `<div class="empty-state">${escapeHtml(text)}</div>`;
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
